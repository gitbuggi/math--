<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>880 数学题库</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232F5E8C'/><text x='50' y='50' font-size='70' font-family='sans-serif' font-weight='bold' fill='%23F6F3EC' text-anchor='middle' dominant-baseline='central'>数</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<style>
:root{
  --paper:#ffffff;--paper-2:#eaecef;--card:#ffffff;
  --ink:#2A251F;--ink-2:#4E463B;--ink-3:#8A8072;--ink-4:#B5AC9B;
  --line:#E2DCCD;--line-2:#D3CBB8;
  --blue:#2F5E8C;--blue-deep:#23476B;--blue-mid:#7A93AA;--blue-soft:#E6EDF4;
  --green:#94CBAB;--green-soft:#E3EDE6;
  --amber:#F5CE82;--amber-soft:#F3EAD9;
  --red:#F2A796;--red-soft:#F5E6E3;
  /*答案样式 */
  --plum:#2F5E8C;  --plum-soft:#EAF0F6;  --plum-fg:#F6F3EC;
  --teal:#3B7168;--teal-soft:#E0ECE9;
  --shadow:0 1px 2px rgba(42,37,31,.05),0 6px 18px rgba(42,37,31,.07);
  --radius:14px;--radius-sm:9px;
  --serif:"Noto Serif SC",serif,"Songti SC","SimSun";
  --sans:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
  --sw:290px;

  /* ===== 柱状图可调参数 ===== */
  --bar-col-width: 28px;        /* 单根柱子宽度 */
  --bar-col-gap: 10px;           /* 柱子之间的间距 */
  --bar-module-gap: 16px;       /* 模块之间额外的间距 */
  --bar-max-height: 240px;      /* 最高柱子的高度（题量最多的章节） */
  --bar-radius: 3px;            /* 柱子圆角 */

  /* 段颜色（未做/陌生/模糊/熟悉） */
  --bar-color-n: #EDE8DC;   /* 未做：奶白 */
  --bar-color-u: #F2A796;   /* 陌生：蜜桃 */
  --bar-color-v: #F5CE82;   /* 模糊：奶黄 */
  --bar-color-f: #94CBAB;   /* 熟悉：薄荷 */



  /* 三个模块的背景色（顺序：微积分、线代、概率） */
  --bar-mod-bg-1: #ffffff;
  --bar-mod-bg-2: #ffffff;
  --bar-mod-bg-3: #ffffff;
}
/* 图片样式 */
.md-image-wrap{
  display:block;
  margin:10px 0;
  text-align:center;
}
/* 图片组内：并排、自动换行 */
.md-image-row{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
  margin:10px 0;
}
.md-image-row .md-image-wrap{
  margin:0;
  flex:0 0 auto;
  max-width:calc(25% - 9px);   /* 每张最多占1/4宽 */
}
.md-image{
  max-width:100%;
  max-height:120px;
  border-radius:8px;
  box-shadow:0 2px 8px rgba(42,37,31,.10);
  cursor:zoom-in;
  transition:transform .18s, box-shadow .18s;
  vertical-align:middle;
}
.md-image:hover{
  transform:scale(1.01);
  box-shadow:0 4px 14px rgba(42,37,31,.16);
}
.md-image-fallback{
  display:inline-block;
  padding:8px 14px;
  border:1px dashed var(--line-2);
  color:var(--ink-3);
  font-size:12px;
  border-radius:6px;
}
/* 表格样式 */
.md-table-wrap{
  overflow-x: auto;
  margin: 10px 0;
  padding-bottom: 4px;
}
.md-table{
  border-collapse: collapse;
  font-size: 14px;
  line-height: 1.5;
  background: transparent;   /* 表格整体透明 */
}
.md-table th,
.md-table td{
  border: 1px solid var(--line-2);
  padding: 5px 14px;
  text-align: center;
  white-space: nowrap;
  background: transparent;   /* 单元格透明 */
}
.md-table th{
  font-weight: 700;
  color: var(--blue-deep);
  background: transparent;   /* 表头也透明 */
}
/* 去掉原来的斑马纹 */
.md-table tbody tr:nth-child(even) td{
  background: transparent;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.65;font-size:15px;min-height:100vh;overflow:hidden}
::selection{background:#CFE0EE}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

.edit-overlay{position:fixed;inset:0;z-index:90;background:rgba(38,33,28,.55);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}
.edit-overlay.open{opacity:1;visibility:visible}
.edit-modal{width:100%;max-width:720px;background:var(--card);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px 22px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.edit-modal h2{font-family:var(--serif);font-size:18px;font-weight:800}
.edit-row{display:flex;flex-direction:column;padding-bottom: 0}
.edit-modal > .edit-grid,
.edit-modal > .edit-row,
.edit-modal > #editOptions{flex-shrink: 0;}
.edit-modal .edit-actions{
  position: sticky;
  bottom: 0;
  background: var(--card);
  padding: 14px 0;
  margin-top: 14px;
  border-top: 1px solid var(--line);
  box-shadow: 0 -4px 12px rgba(42,37,31,.04);
  z-index: 5;
}
.edit-row label{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:1px}
.edit-row input,.edit-row textarea{font-size:13.5px;padding:8px 10px;border-radius:7px;border:1px solid var(--line-2);background:#FCFAF5;color:var(--ink);font-family:inherit}
#editContent{min-height:90px;max-height:45vh}
.edit-row textarea{resize:vertical;min-height:140px;font-family:var(--mono);line-height:1.65}
.edit-row input:focus,.edit-row textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.edit-row input[readonly]{background:var(--paper-2);color:var(--ink-3);cursor:not-allowed}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-grid > .edit-row{
  min-width: 0;
}
.edit-grid .edit-row input,
.edit-grid .edit-row select{
  width: 100%;
  min-width: 0;
}
.edit-grid .edit-row{margin:0}
.edit-id-preview{
  display:flex;align-items:center;gap:12px;
  padding:9px 14px;background:var(--paper-2);border-radius:8px;
}
.eip-label{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:1.5px;flex:none}
.eip-value{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--blue-deep);letter-spacing:2px}
.eip-hint{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.edit-row select{
  font-size:13.5px;padding:8px 10px;border-radius:7px;
  border:1px solid var(--line-2);background:#FCFAF5;color:var(--ink);
}
.edit-row select:focus{outline:none;border-color:var(--blue);background:#fff}
.edit-actions{display:flex;gap:8px;align-items:center;padding-top:12px;border-top:1px solid var(--line)}

/* 题目编辑按钮 */
.q-edit-btn{
  position:absolute;
  top:18px;
  right:0;
  width:24px;
  height:24px;
  border-radius:6px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--ink-4);
  opacity:.4;
  transition:all .15s;
  z-index:2;
}
.qitem:hover .q-edit-btn{opacity:1}
.q-edit-btn:hover{background:var(--blue-soft);color:var(--blue)}
.q-edit-btn svg{width:13px;height:13px}

.edit-id-hint{
  display:grid;
  grid-template-columns:34px 1fr;
  gap:2px 8px;
  font-size:11.5px;
  color:var(--ink-3);
  line-height:1.7;
  padding:8px 10px;
  background:var(--paper-2);
  border-radius:7px;
  margin-top:4px;
}
.edit-id-hint .eh-num{
  font-family:var(--mono);
  font-weight:700;
  color:var(--blue-deep);
  text-align:right;
}
.edit-id-hint b{
  font-family:var(--mono);
  color:var(--blue-deep);
  font-weight:700;
  background:rgba(47,94,140,.08);
  padding:0 4px;
  border-radius:3px;
}
.edit-id-hint .eh-eg{
  grid-column:1 / -1;
  margin-top:6px;
  padding-top:6px;
  border-top:1px dashed var(--line-2);
  color:var(--ink-2);
  font-size:11.5px;
}
.edit-id-hint .eh-eg b{
  background:transparent;
  padding:0;
}
.edit-id-hint .eh-next{
  grid-column:1 / -1;
  margin-top:4px;
  font-size:11.5px;
  color:var(--green);
  font-weight:600;
  min-height:1.7em;
}
.edit-id-hint .eh-next b{
  color:var(--green);
  background:rgba(62,115,86,.1);
}
/* ===== 公式 ===== */
/* 行内公式：普通分式放大 */
.math-inline .katex .mfrac {
  font-size: 1.2em !important;
}
/* 指数/下标里的分式：恢复原样，不要放大 */
.math-inline .katex .msupsub .mfrac {
  font-size: 1em  !important;
}
/* 二重嵌套（指数里的指数）里再缩小一点 */
.math-inline .katex .msupsub .msupsub .mfrac {
  font-size: 0.9em  !important;
}
.math-inline .katex .mtable .mfrac {
  font-size: 1.2em  !important;
}
/* ===== 顶栏 ===== */
.topbar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(244,241,232,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:relative;z-index:30}
.menu-btn{display:none;width:34px;height:34px;border-radius:8px;align-items:center;justify-content:center;color:var(--ink-2);flex:none}
.menu-btn:hover{background:var(--paper-2)}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--blue);color:#F6F3EC;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;font-size:14px}
.brand-name{font-family:var(--serif);font-weight:700;font-size:15px;letter-spacing:.5px}
.searchbox{position:relative;flex:1;max-width:480px;display:flex;align-items:center;margin-left:6px}
.searchbox>svg.s-ic{position:absolute;left:11px;width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.searchbox input{width:100%;padding:7px 66px 7px 34px;border-radius:8px;border:1px solid var(--line-2);background:#FCFAF5;font-size:13.5px;color:var(--ink)}
.searchbox input:focus{outline:none;border-color:var(--blue);background:#fff}
.searchbox .search-actions{position:absolute;right:5px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.searchbox .s-btn{width:28px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.searchbox .s-btn:hover{background:var(--paper-2);color:var(--ink)}
.searchbox .s-btn svg{width:15px;height:15px}
.searchbox .s-btn.on{background:var(--blue);color:#F6F3EC}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
.icon-btn{width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--paper-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.attn{color:var(--blue);background:var(--blue-soft)}
.icon-btn.attn:hover{background:#D6E4F0}

/* ===== 布局 ===== */
.layout{display:flex;height:calc(100vh - 52px);overflow:hidden}
.sidebar{width:var(--sw);flex:none;background:var(--paper-2);border-right:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.sidebar-inner{
  flex:1;
  overflow-y:scroll;
  padding:12px 6px 40px;
  scrollbar-gutter:stable;
}
.sidebar-title{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:1.8px;padding:0 10px 8px}
.sidebar-head{
  padding:8px 10px 10px;
  border-bottom:1px solid var(--line);
  margin-bottom:6px;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.sh-row{display:flex;align-items:center;gap:8px}
.sh-lbl{font-size:10px;font-weight:700;color:var(--ink-3);letter-spacing:1.5px;flex:none}
.sidebar-head select{
  flex:1;font-size:12px;padding:3px 6px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
}
.sh-toggle{display:flex;gap:2px;flex:1}
.sh-toggle button{
  flex:1;font-size:11px;padding:3px 6px;border-radius:6px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  cursor:pointer;font-weight:600;transition:all .12s;
}
.sh-toggle button:hover{border-color:var(--blue);color:var(--blue)}
.sh-toggle button.on{background:var(--blue);border-color:var(--blue);color:#F6F3EC}

.tree{display:flex;flex-direction:column;gap:0}
.tree-node{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:4px 8px;border-radius:6px;font-size:13px;color:var(--ink-2);transition:background .12s;position:relative;box-sizing:border-box}
.tree-node:hover{background:var(--paper)}
.tree-node .arrow{width:14px;height:14px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-3);transition:transform .15s;border-radius:3px}
.tree-node .arrow:hover{background:var(--line-2)}
.tree-node .arrow svg{width:10px;height:10px}
.tree-node.open>.arrow{transform:rotate(90deg)}
.tree-node .arrow.empty{visibility:hidden}
.tree-node .dot{width:8px;height:8px;border-radius:50%;flex:none}
.tree-node .label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-node .label:hover{color:var(--blue)}
.tree-node .cnt{font-size:11px;color:var(--ink-3);font-family:var(--mono);flex:none}
.tree-node .st-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--line-2)}
.tree-node .st-dot.g{background:var(--green)}
.tree-node .st-dot.a{background:var(--amber)}
.tree-node .st-dot.r{background:var(--red)}
.tree-node.active{background:var(--blue);color:#F6F3EC}
.tree-node.active .cnt{color:rgba(255,255,255,.75)}
.tree-node.active .arrow{color:rgba(255,255,255,.8)}
.tree-node.active .label:hover{color:#fff}
.tree-mod{font-weight:700;font-family:var(--serif);letter-spacing:.4px;font-size:13.5px;color:var(--ink)}
.tree-ch{padding-left:12px}
.tree-lv{padding-left:24px}
.tree-ty{padding-left:20px;font-size:12.5px;padding-top:3px;padding-bottom:3px;line-height:1.15}
.tree-children{display:none;flex-direction:column;gap:0}
.tree-node.open+.tree-children{display:flex}
.tree-ty .label{line-height:1.15}
.sidebar-divider{height:1px;background:var(--line);margin:6px 10px}
.tree-extra{display:flex;flex-direction:column;gap:0}
.tree-extra .tree-node{font-weight:500;color:var(--ink-2);padding:2px 8px;line-height:1.1;min-height:0}
.tree-extra .tree-node.active{color:#F6F3EC}
.tree-extra .tree-node .label{line-height:1.1}
.tree-extra .tree-node .cnt{line-height:1;font-size:10px}

/* ===== 内容区 ===== */
.content{
  flex:1;
  overflow-y:scroll;            /* 始终显示滚动条轨道，避免跳动 */
  background:var(--paper);
  scroll-behavior:smooth;
  scrollbar-gutter:stable;       /* 即使没滚动条也预留空间 */
}
.view{display:none}
.view.active{display:block}
.view-inner{max-width:960px;margin:0 auto;padding:22px 18px 70px}

/* ===== 章节头 ===== */
.list-head{margin-bottom:14px}
.list-head .eyebrow{font-size:12px;color:var(--ink-3);font-family:var(--serif);letter-spacing:.8px}
.list-head .title{font-family:var(--serif);font-size:24px;font-weight:800;letter-spacing:.5px;margin:3px 0 8px}
.list-head .meta{font-size:13px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.list-head .meta b{color:var(--ink);font-weight:700}
.list-head .meta .meta-chip{
  display:inline-flex;
  align-items:center;
  gap:3px;
  padding:3px 10px;
  border-radius:20px;
  font-size:13px;
  background:transparent;
  border:1px solid transparent;
  color:var(--ink-3);
  cursor:pointer;
  transition:all .13s;
  font-family:inherit;
}
.list-head .meta .meta-chip:hover{
  background:var(--paper-2);
}
.list-head .meta .meta-chip b{color:inherit}
.list-head .meta .meta-chip.f{color:var(--green)}
.list-head .meta .meta-chip.v{color:var(--amber)}
.list-head .meta .meta-chip.u{color:var(--red)}
.list-head .meta .meta-chip.n{color:var(--amber)}
.list-head .meta .meta-chip.on{
  color:#fff;
}
.list-head .meta .meta-chip.f.on{background:var(--green);border-color:var(--green)}
.list-head .meta .meta-chip.v.on{background:var(--amber);border-color:var(--amber)}
.list-head .meta .meta-chip.u.on{background:var(--red);border-color:var(--red)}
.list-head .meta .meta-chip.n.on{background:var(--amber);border-color:var(--amber)}

.list-head .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--card);border:1px solid var(--line-2);transition:all .15s}
.mini-btn:hover{border-color:var(--blue);color:var(--blue)}
.mini-btn svg{width:13px;height:13px}
/* 页头进度条 */
.head-summary{
  display:flex;
  align-items:center;
  gap:16px;
  margin:10px 0 4px;
  flex-wrap:wrap;
}
.head-progress{
  flex:0 0 50%;
  max-width:50%;
}
.head-progress .bar{
  height:10px;
  border-radius:5px;
  overflow:hidden;
  display:flex;
  background:var(--paper-2);
  box-shadow:inset 0 0 0 1px rgba(42,37,31,.06);
}
.head-progress .bar > .seg{
  height:100%;
  cursor:pointer;
  transition:flex .35s ease, filter .15s;
  position:relative;
}
.head-progress .bar > .seg:hover{ filter:brightness(.9); }
.head-progress .bar > .seg.active{
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.85);
  filter:brightness(1.08);
}
.head-progress .bar > .seg.f{ background:var(--green); }
.head-progress .bar > .seg.v{ background:var(--amber); }
.head-progress .bar > .seg.u{ background:var(--red); }
.head-progress .bar > .seg.n{ background:#D8D2C4; }

.head-stats{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--ink-2);
  flex:1;
  min-width:0;
  flex-wrap:wrap;
}
.head-stats b{
  font-family:var(--serif);
  color:var(--blue-deep);
  font-weight:700;
  font-size:14px;
}
.head-stats .stat-sep{ color:var(--ink-4); }
.head-stats .stat-link{
  font-size:13px;
  color:var(--ink-2);
  background:none;
  border:none;
  cursor:pointer;
  padding:2px 8px;
  border-radius:5px;
  font-family:inherit;
  transition:all .13s;
}
.head-stats .stat-link:hover{ background:var(--paper-2); }
.head-stats .stat-link.on{ background:var(--blue); color:#F6F3EC; }
.head-stats .stat-link.on b{ color:#F6F3EC; }

@media (max-width:700px){
  .head-progress{ flex:0 0 100%; max-width:100%; }
}
/* 章节标签条 */
.tagbar{margin:12px 0 16px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tagbar .tb-label{font-size:11.5px;color:var(--ink-3);font-weight:600;letter-spacing:.5px;margin-right:2px}
.tagbar .tb-chip{padding:4px 11px;border-radius:20px;font-size:12.5px;font-weight:500;background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);transition:all .13s;white-space:nowrap}
.tagbar .tb-chip:hover{border-color:var(--blue);color:var(--blue)}
.tagbar .tb-chip.on{background:var(--blue);border-color:var(--blue);color:#F6F3EC}
.tagbar .tb-chip .n{font-size:11px;opacity:.72;margin-left:4px;font-family:var(--mono)}
.tagbar .tb-more{font-size:12px;color:var(--blue);border:1px dashed var(--blue);padding:3px 10px;border-radius:20px;opacity:.85}
.tagbar .tb-more:hover{opacity:1;background:var(--blue-soft)}

/* ===== 题目列表 ===== */
.qlist{display:flex;flex-direction:column;gap:0}

/* ===== 题目列表的分组标题 ===== */
.group-chapter{
  font-family:var(--serif);
  font-size:24px;
  font-weight:900;
  letter-spacing:1px;
  color:var(--ink);
  margin:36px 0 6px;
  padding:0 0 12px 0;
  border-bottom:3px double var(--line-2);
  position:relative;
}
.group-chapter::before{
  content:"";
  position:absolute;
  left:0;bottom:-3px;
  width:64px;height:3px;
  background:var(--blue);
}
.group-chapter:first-child{margin-top:4px}

/* 难度：大字号 + 整块蓝底（用负 margin 抵消 padding，文字与题号左对齐） */
.group-level{
  font-family:var(--serif);
  font-size:21px;
  font-weight:900;
  letter-spacing:4px;
  color:var(--blue-deep);
  margin:28px 0 10px -18px;
  padding:10px 18px;
  background:var(--blue-soft);
  border-radius:8px;
  display:block;
}

/* 题型：左侧竖条样式，缩进比难度多 */
.group-type{
  font-family:var(--serif);
  font-size:18px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--blue-deep);
  margin:20px 0 8px;
  padding-left:24px;
  position:relative;
  display:block;
}
.group-type::before{
  content:"";
  position:absolute;
  left:0;top:3px;bottom:3px;
  width:4px;
  background:var(--blue);
  border-radius:2px;
}

.group-chapter + .group-level{margin-top:16px}
.group-level + .group-type{margin-top:14px}
.group-type + .qitem{padding-top:10px}

.qitem{padding:18px 0;border-bottom:1px solid var(--line);position:relative}
.qitem:first-child{padding-top:8px}
.qhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.qno{font-family:var(--serif);font-weight:700;font-size:15px;color:var(--ink);flex:none;line-height:1.6;min-width:28px}
.q-source-text{font-size:11.5px;color:var(--ink-3);font-family:var(--serif);letter-spacing:.5px;flex:none;margin-left:auto;padding-left:8px;}
.qbody{flex:1;min-width:0}
.qtext{font-size:15px;line-height:1.9;color:var(--ink);overflow-wrap:break-word}
.qtext .math-inline{display:inline-block;vertical-align:middle}
.qtext .math-block{margin:5px 0;overflow-x:auto;padding:1px 0}
.qtext .math-block .katex-display{margin:.3em 0}
.qopts{margin-top:8px;display:grid;grid-template-columns:repeat(2,1fr);gap:4px 18px;font-size:14.5px}
.qopts.one-col{grid-template-columns:1fr}
.opt{display:flex;gap:7px;align-items:flex-start;padding:3px 0;line-height:1.7}
.opt .l{flex:none;font-weight:700;color:var(--ink-2);font-family:var(--serif)}
.opt .b{flex:1;overflow-wrap:break-word}

/* ====== 学习记录圆圈 ====== */
.q-records{
  display:inline-flex;
  align-items:center;
  gap:5px;
}
.rec-circle{
  width:14px;
  height:14px;
  border-radius:50%;
  border:1.5px solid var(--line-2);
  background:transparent;
  cursor:pointer;
  transition:transform .12s, background .15s, border-color .15s;
  flex:none;
  display:inline-block;
}
.rec-circle:hover{ transform:scale(1.2); }
.rec-circle.f{ background:var(--green); border-color:var(--green); }
.rec-circle.v{ background:var(--amber); border-color:var(--amber); }
.rec-circle.u{ background:var(--red); border-color:var(--red); }

.rec-menu button{
  padding:5px 12px;
  border-radius:6px;
  font-size:12px;
  font-weight:600;
  border:none;
  background:transparent;
  cursor:pointer;
  color:var(--ink-2);
  font-family:inherit;
  transition:background .12s, color .12s;
}
.rec-menu button[data-s="f"]:hover{ background:var(--green-soft); color:var(--green); }
.rec-menu button[data-s="v"]:hover{ background:var(--amber-soft); color:var(--amber); }
.rec-menu button[data-s="u"]:hover{ background:var(--red-soft); color:var(--red); }
/* 题目底部操作行 */
.qbar{
  margin-top:10px;
  padding-top:9px;
  padding-left:36px;
  border-top:1px dashed var(--line-2);
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.qtag-wrap{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.qbar-left{display:flex;align-items:center;gap:5px;flex-wrap:wrap;flex:1;min-width:0}
.qbar-right{
  display:flex;
  align-items:center;
  gap:4px;
  flex:0 0 60%;
  justify-content:flex-start;
}
.ctag{
  display:inline-flex;
  align-items:center;
  gap:3px;
  font-size:11.5px;
  font-weight:600;
  color:var(--blue);
  background:rgba(47,94,140,.06);
  border:1px solid rgba(47,94,140,.30);
  border-radius:20px;
  padding:1px 8px;
  white-space:nowrap;
  line-height:1.6;
  transition:all .13s;
}
.ctag:hover{
  background:rgba(47,94,140,.12);
  border-color:rgba(47,94,140,.5);
  color:var(--blue-deep);
}
.ctag button{
  width:12px;
  height:12px;
  border-radius:50%;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:var(--blue);
  flex:none;
  transition:all .13s;
}
.ctag button svg{width:9px;height:9px}
.ctag button:hover{
  background:rgba(47,94,140,.18);
  color:var(--blue-deep);
}
.mini-icon-btn{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-4);transition:all .13s}
.mini-icon-btn:hover{background:var(--paper-2);color:var(--blue)}
.mini-icon-btn svg{width:12px;height:12px}
.mini-icon-btn.dim{opacity:.5}
.mini-icon-btn.has-note{
  color:var(--blue);
  background:var(--blue-soft);
  opacity:1;
}
.mini-icon-btn.has-note:hover{
  background:#CFE0EE;
}
.tag-input-wrap{position:relative;display:inline-flex;align-items:center}
.tag-input{width:120px;font-size:12px;padding:3px 8px;border-radius:16px;border:1px solid var(--blue);background:var(--card);color:var(--ink)}
.tag-suggest{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:140px;background:var(--card);border:1px solid var(--line-2);border-radius:9px;box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;max-height:170px;overflow:auto}
.tag-suggest .hint{padding:3px 9px;font-size:11px;color:var(--ink-3);border-bottom:1px dashed var(--line-2);margin-bottom:3px}
.tag-suggest button{text-align:left;font-size:12px;padding:5px 9px;border-radius:6px;color:var(--ink-2)}
.tag-suggest button:hover{background:var(--blue-soft);color:var(--blue-deep)}
.st-btn{padding:3px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--ink-3);border:1px solid transparent;transition:all .13s;white-space:nowrap}
.st-btn:hover{background:var(--paper-2);color:var(--ink-2)}
.st-btn.on{color:#fff}
.st-btn.on-f{background:var(--green);color:#F2F6F2}
.st-btn.on-v{background:var(--amber);color:#FBF4EA}
.st-btn.on-u{background:var(--red);color:#FBEEEC}

/* 笔记 */
.qnote-slot{padding-left:36px}
.qnote-slot.collapsed{display:none}
.qnote{margin-top:6px;font-size:13.5px;line-height:1.75;color:var(--ink-2);word-break:break-word;padding:6px 10px;background:#FBF7EF;border-left:3px solid #E8DCC4;border-radius:0 6px 6px 0;cursor:text}
.qnote:hover{border-left-color:var(--blue)}
.qnote-edit{width:100%;margin-top:6px;padding:8px 10px;font-size:13.5px;line-height:1.75;border:1px solid var(--blue);border-radius:7px;background:#FBF7EF;color:var(--ink);resize:none;min-height:70px;overflow:hidden;box-sizing:border-box}
.qnote-edit:focus{outline:none;border-color:var(--blue-deep)}

/* 解析 */
.qans-slot{padding-left:36px}
.qans-slot:not(.open){display:none}
.qans{margin-top:6px;font-size:13.5px;line-height:1.8;color:var(--ink-2);word-break:break-word;padding:8px 12px;background:var(--plum-soft);border-left:3px solid var(--plum);border-radius:0 6px 6px 0}
.mini-icon-btn.has-ans{color:var(--plum);opacity:1}
.mini-icon-btn.has-ans:hover{background:var(--plum-soft);color:var(--plum)}
.mini-icon-btn.ans-open{background:var(--plum);color:var(--plum-fg)}
.mini-icon-btn.ans-open:hover{background:var(--plum);color:var(--plum-fg)}

/*左下角标签*/
.q-mini-tags{
  font-size:11.5px;
  color:var(--ink-3);
  font-family:var(--serif);
  letter-spacing:.3px;
  flex:none;
  margin-left:8px;
  padding:0 6px;
  border-left:1px solid var(--line-2);
}

.qans-slot .qans{cursor:text;transition:background .13s}
.qans-slot .qans:hover{background:var(--plum-soft)}
.qans-empty{color:var(--ink-3);font-style:italic}
.qans-edit{
  width:100%;margin-top:6px;padding:8px 10px;
  font-size:13.5px;line-height:1.8;
  border:1px solid var(--plum);border-radius:7px;
  background:#F7FBF9;color:var(--ink);
  resize:none;min-height:70px;overflow:hidden;
  box-sizing:border-box;font-family:inherit;
}
.qans-edit:focus{outline:none;border-color:var(--blue-deep)}
/* 加载更多 */
.loadmore-wrap{display:flex;justify-content:center;margin:24px 0}
.loadmore-btn{padding:9px 22px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);background:var(--card);border:1px solid var(--line-2);transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.loadmore-btn:hover{border-color:var(--blue);color:var(--blue)}
.loadmore-btn svg{width:14px;height:14px}
.loadmore-info{font-size:11.5px;color:var(--ink-3);margin-top:6px;text-align:center}

/* 空状态 */
.empty{text-align:center;padding:48px 20px;color:var(--ink-3);border:1.5px dashed var(--line-2);border-radius:var(--radius);background:rgba(255,254,251,.5)}
.empty .t{font-size:14.5px;font-weight:600;color:var(--ink-2);margin-top:8px}
.empty .d{font-size:12.5px;margin-top:3px}

/* 搜索浮层 */
.search-panel{position:absolute;top:48px;left:14px;z-index:60;width:min(680px,calc(100vw - 28px));background:var(--card);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.14);padding:16px 18px;display:none}
.search-panel.open{display:block}
.search-panel h4{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:1.5px;margin:10px 0 7px}
.search-panel h4:first-child{margin-top:0}
.search-panel select{font-size:13px;padding:5px 9px;border-radius:7px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);max-width:100%}
.search-panel .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-panel .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.search-panel{width:min(900px,calc(100vw - 28px))}
.sf-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px 24px;
  margin-bottom:12px;
}
#sfHistoryWrap .sf-col:empty{display:none}
#sfHistoryWrap{grid-template-columns:1fr}   /* 右列隐藏后自动变单列 */
.sf-col h4{
  font-size:11.5px;font-weight:700;color:var(--ink-3);
  letter-spacing:1.5px;margin:0 0 7px;
}
.sf-col .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sf-col .row select{flex:1;min-width:0}
.sf-col .sf-chips{display:flex;gap:6px;flex-wrap:wrap}

@media (max-width:700px){
  .search-panel{width:min(680px,calc(100vw - 28px))}
  .sf-row{grid-template-columns:1fr}
}
.sf-chip{display:inline-flex;align-items:center;padding:4px 11px;border-radius:16px;font-size:12.5px;background:var(--card);border:1px solid var(--line-2);color:var(--ink-2);transition:all .13s;white-space:nowrap}
.sf-chip:hover{border-color:var(--blue);color:var(--blue)}
.sf-chip.on{background:var(--blue);border-color:var(--blue);color:#F6F3EC}
.sf-chips{display:flex;gap:6px;flex-wrap:wrap}
.sf-more{
  display:inline-flex;align-items:center;padding:4px 11px;border-radius:16px;
  font-size:12.5px;background:transparent;border:1px dashed var(--blue);
  color:var(--blue);cursor:pointer;font-family:inherit;transition:all .13s;
}
.sf-more:hover{background:var(--blue-soft)}
/* 通用按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line-2);transition:all .15s}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#F6F3EC}
.btn.primary:hover{background:var(--blue-deep);color:#F6F3EC}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:7px}

/* ===== 仪表盘 ===== */
.dash-hero{background:linear-gradient(140deg,#2F5E8C 0%,#23476B 60%,#1E3D5C 100%);color:#F4F1E8;border-radius:16px;padding:24px 26px;margin-bottom:18px;position:relative;overflow:hidden}
.dash-hero::before{content:"Σ";position:absolute;right:20px;bottom:-28px;font-family:var(--serif);font-size:130px;font-weight:900;color:rgba(244,241,232,.07);line-height:1}
.dash-hero .k{font-size:11.5px;letter-spacing:3px;color:#B9CBDC;font-weight:700}
.dash-hero h1{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:1px;margin:7px 0 6px}
.dash-hero p{font-size:13px;color:#C9D8E5;max-width:520px;line-height:1.7;position:relative;z-index:1}
.dash-hero .row{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap;position:relative;z-index:1}
.dash-hero .btn-l{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:9px;font-size:13px;font-weight:600;background:rgba(255,255,255,.14);color:#F4F1E8;border:1px solid rgba(255,255,255,.24)}
.dash-hero .btn-l:hover{background:rgba(255,255,255,.22)}
.dash-hero .btn-l.primary{background:#F4F1E8;color:var(--blue-deep);border-color:transparent}
.dash-hero .btn-l.primary:hover{background:#fff}

.dash-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px}
@media (max-width:800px){.dash-grid{grid-template-columns:1fr}}
.dash-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
.dash-panel h3{font-family:var(--serif);font-size:14.5px;font-weight:700;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.dash-panel h3 svg{width:15px;height:15px;color:var(--blue)}
.dash-panel h3 .hint{font-size:11.5px;font-weight:500;color:var(--ink-3);margin-left:auto;font-family:var(--sans);letter-spacing:0}

.ring-wrap{display:flex;align-items:center;gap:20px}
.ring{width:110px;height:110px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:var(--paper-2);stroke-width:10}
.ring .fg {
  fill:none;
  stroke-width:10;
  stroke-linecap: butt; /* 👈 必须改成 butt（平头），否则多段拼接会错位 */
  transition: stroke-dashoffset .5s ease;
}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:22px;font-weight:900;color:var(--ink)}
.ring .pct small{font-size:12px;color:var(--ink-3);margin-left:1px}
.ring-legend{display:flex;flex-direction:column;gap:7px;flex:1}
.ring-legend .lg-row{display:flex;align-items:center;gap:8px;font-size:13px}
.ring-legend .lg-dot{width:9px;height:9px;border-radius:50%;flex:none}
.ring-legend .lg-n{font-family:var(--mono);font-weight:700;color:var(--ink);margin-left:auto}

.note-list{display:flex;flex-direction:column;gap:7px}
.note-item{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#FCFAF5;cursor:pointer;transition:all .13s;text-align:left;width:100%}
.note-item:hover{border-color:var(--blue);background:var(--blue-soft)}
.note-item .no{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue);flex:none;margin-top:2px}
.note-item .body{flex:1;min-width:0}
.note-item .body .sum{font-size:12.5px;color:var(--ink);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.note-item .body .meta{font-size:11px;color:var(--ink-3);margin-top:2px;font-family:var(--serif)}

/* ===== 章节柱状图 ===== */
.bar-chart-row{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:var(--bar-module-gap);
  padding:14px 0 4px;
  width:fit-content;
  margin:0 auto;
}

.bar-module{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:6px;
  padding:6px 6px 4px;
  border-radius:8px;
}

.bar-module-bars{
  display:flex;
  align-items:flex-end;
  gap:var(--bar-col-gap);
}

.bar-col{
  width:var(--bar-col-width);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
}

.bar-col-count{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  color:var(--ink-3);
  line-height:1;
  margin-bottom:2px;
}

.bar-col-tube{
  width:100%;
  border-radius:var(--bar-radius) var(--bar-radius) 0 0;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  background:#EFE9DB;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.03);
}

.bar-col-tube .seg{
  width:100%;
  cursor:pointer;
  transition:filter .12s;
}
.bar-col-tube .seg:hover{filter:brightness(1.15) saturate(1.2)}

.bar-col-tube .seg.n{background:var(--bar-color-n)}
.bar-col-tube .seg.u{background:var(--bar-color-u)}
.bar-col-tube .seg.v{background:var(--bar-color-v)}
.bar-col-tube .seg.f{background:var(--bar-color-f)}

.bar-col-name{
  font-family:var(--mono);
  font-size:10px;
  font-weight:600;
  color:var(--ink-3);
  line-height:1;
  white-space:nowrap;
}

.bar-module-name{
  text-align:center;
  font-family:var(--serif);
  font-size:12px;
  font-weight:700;
  letter-spacing:.5px;
  color:var(--ink-2);
  padding:2px 4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.bar-module-name .pct{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-3);
  margin-left:5px;
  font-weight:500;
}

.bar-seg-tip{
  position:fixed;
  display:none;
  background:rgba(42,37,31,.95);
  color:#F4F1E8;
  font-size:11.5px;
  padding:6px 11px;
  border-radius:6px;
  white-space:nowrap;
  z-index:200;
  font-weight:500;
  pointer-events:none;
  box-shadow:0 4px 12px rgba(0,0,0,.22);
  font-family:var(--sans);
  transform:translate(-50%, -100%);
}
/* 柱状图难度切换 */
.bar-lv-switch{
  display:inline-flex;
  gap:2px;
  margin-left:auto;
  font-family:var(--sans);
  letter-spacing:0;
  font-weight:500;
}
.bar-lv-switch button{
  font-size:11px;
  padding:2px 9px;
  border-radius:12px;
  border:1px solid var(--line-2);
  background:var(--card);
  color:var(--ink-3);
  cursor:pointer;
  transition:all .13s;
  font-family:inherit;
}
.bar-lv-switch button:hover{border-color:var(--blue);color:var(--blue)}
.bar-lv-switch button.on{
  background:var(--blue);
  border-color:var(--blue);
  color:#F6F3EC;
}
.bar-legend{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:11.5px;
  color:var(--ink-3);
  margin-top:12px;
  flex-wrap:wrap;
}
.bar-legend span{display:inline-flex;align-items:center;gap:5px}
.bar-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}

/* ===== 专题练习 / 会话 ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.panel h3{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.6px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.panel h3 svg{width:15px;height:15px;color:var(--blue)}
.panel-sub{margin-top:12px}
.panel-sub h4{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:1.5px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:20px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-size:12.5px;font-weight:500;transition:all .13s;white-space:nowrap}
.chip:hover{border-color:var(--blue);color:var(--blue)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#F6F3EC}
.chip .n{font-size:11px;opacity:.75;font-weight:700}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.sel-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.session-wrap{max-width:820px;margin:0 auto}
.session-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 16px}
.session-head .meta{flex:1;min-width:0}
.session-head .meta .tt{font-size:13.5px;font-weight:700}
.session-head .meta .st{font-size:12px;color:var(--ink-3);margin-top:1px}
.pbar{height:6px;border-radius:4px;background:var(--paper-2);overflow:hidden;margin-top:6px}
.pbar .pf{height:100%;background:var(--blue);border-radius:4px;transition:width .3s}
.session-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.sa-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:10px;font-size:14px;font-weight:700;border:1.5px solid var(--line-2);background:var(--card);color:var(--ink-2);transition:all .13s}
.sa-btn.f{border-color:#B9D0C2;color:var(--green)}
.sa-btn.f:hover{background:var(--green);border-color:var(--green);color:#F2F6F2}
.sa-btn.v{border-color:#E4CFB8;color:var(--amber)}
.sa-btn.v:hover{background:var(--amber);border-color:var(--amber);color:#FBF4EA}
.sa-btn.u{border-color:#E8C5C0;color:var(--red)}
.sa-btn.u:hover{background:var(--red);border-color:var(--red);color:#FBEEEC}
.summary-card{text-align:center;padding:34px 22px}
.summary-card .done-ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center}
.summary-card .done-ic svg{width:26px;height:26px}
.summary-card h2{font-family:var(--serif);font-size:20px;font-weight:900}
.summary-stats{display:flex;justify-content:center;gap:9px;margin:18px 0;flex-wrap:wrap}
.sstat{min-width:90px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:#FCFAF5}
.sstat .v{font-family:var(--serif);font-size:20px;font-weight:900}
.sstat .k{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.sstat.f .v{color:var(--green)}.sstat.v .v{color:var(--amber)}.sstat.u .v{color:var(--red)}.sstat.n .v{color:var(--ink-3)}
.summary-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

/* ===== 设置弹窗 ===== */
.settings-overlay{position:fixed;inset:0;z-index:80;background:rgba(38,33,28,.5);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .16s,visibility .16s}
.settings-overlay.open{opacity:1;visibility:visible}
.settings-modal{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--radius);box-shadow:0 20px 60px rgba(0,0,0,.25);padding:20px 22px;transform:translateY(6px);transition:transform .16s;max-height:90vh;overflow-y:auto}
.settings-overlay.open .settings-modal{transform:none}
.settings-modal h2{font-family:var(--serif);font-size:18px;font-weight:800;margin-bottom:14px}
.set-group{margin-bottom:16px}
.set-group h4{font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:1.5px;margin-bottom:6px}
.set-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:none}
.set-row .lbl{flex:1;font-size:13px}
.set-row .lbl .desc{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.set-row select{font-size:13px;padding:4px 8px;border-radius:7px;border:1px solid var(--line-2);background:var(--card);color:var(--ink)}
.settings-modal .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ===== Toast ===== */
.toast-wrap{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(42,37,31,.93);color:#F4F1E8;font-size:13px;padding:8px 17px;border-radius:22px;box-shadow:var(--shadow);animation:toastIn .22s ease;max-width:88vw}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== 移动端 ===== */
.sidebar-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
@media (max-width:860px){
  .menu-btn{display:inline-flex}
  .brand-name{display:none}
  .searchbox{max-width:none}
  .sidebar{position:fixed;top:52px;bottom:0;left:0;z-index:45;transform:translateX(-100%);transition:transform .22s ease;box-shadow:4px 0 24px rgba(0,0,0,.14)}
  .sidebar.open{transform:none}
  .sidebar-mask.show{display:block}
  .view-inner{padding:16px 14px 60px}
  .list-head .title{font-size:20px}
  .qopts{grid-template-columns:1fr}
  .dash-hero{padding:18px 18px}
  .dash-hero h1{font-size:20px}
  .sa-btn{flex:1;min-width:100px;font-size:13px;padding:10px 12px}
  .search-panel{left:8px;right:8px;width:auto}
}

/* ===== 打印 ===== */
@media print{
  body{background:#fff;overflow:visible}
  .topbar,.sidebar,.sidebar-mask,.qbar,.list-head .actions,.loadmore-wrap,.toast-wrap,.settings-overlay,.search-panel{display:none!important}
  .layout{display:block;height:auto;overflow:visible}
  .content{overflow:visible}
  .view-inner{padding:0;max-width:none}
  .qitem{page-break-inside:avoid;border-bottom:1px solid #ddd}
  .qnote{border-left:3px solid #999;background:#f8f8f8}
  .list-head .title{font-size:16pt}
}

/* ===== 目录紧凑布局修复 ===== */
.tree, .tree-children, .tree-extra{flex:0 0 auto !important;min-height:0 !important}
.tree-node{height:32px !important;min-height:32px !important;max-height:32px !important;flex:0 0 32px !important;box-sizing:border-box !important}
.tree-ty{height:27px !important;min-height:27px !important;max-height:27px !important;flex-basis:27px !important;padding-top:3px !important;padding-bottom:3px !important}
.tree-extra .tree-node{height:30px !important;min-height:30px !important;max-height:30px !important;flex-basis:30px !important;padding-top:2px !important;padding-bottom:2px !important}
.sidebar-divider{margin:6px 10px !important}
#tree,#treeExtra,#tree .tree-children,#treeExtra .tree-children{display:flex !important;flex-direction:column !important;gap:0 !important;flex:0 0 auto !important;height:auto !important;min-height:0 !important}
#tree .tree-children{display:none !important}
#tree .tree-node.open + .tree-children{display:flex !important}
#tree .tree-node,#treeExtra .tree-node{display:flex !important;align-items:center !important;flex:0 0 28px !important;height:28px !important;min-height:28px !important;max-height:28px !important;margin:0 !important;box-sizing:border-box !important;overflow:hidden !important}
#tree .tree-ty{flex:0 0 27px !important;height:27px !important;min-height:27px !important;max-height:27px !important;padding-top:3px !important;padding-bottom:3px !important}
#treeExtra .tree-node{flex-basis:30px !important;height:30px !important;min-height:30px !important;max-height:30px !important;padding-top:2px !important;padding-bottom:2px !important}
#tree .tree-lv,#tree .tree-ch{height:auto !important;min-height:0 !important;max-height:none !important}
.sidebar-divider{height:1px !important;margin:6px 10px !important;flex:0 0 1px !important}
#tree .tree-children{display:none !important;flex-direction:column !important;align-items:stretch !important;justify-content:flex-start !important;gap:0 !important;height:auto !important;max-height:none !important;min-height:0 !important;padding:0 !important;margin:0 !important;overflow:visible !important}
#tree .tree-node.open + .tree-children{display:block !important}
#tree .tree-node.tree-ty{display:flex !important;width:100% !important;height:27px !important;min-height:27px !important;max-height:27px !important;flex:none !important;margin:0 !important;padding-top:3px !important;padding-bottom:3px !important;box-sizing:border-box !important}
#tree .tree-children > .tree-node{height:27px !important;min-height:27px !important;max-height:27px !important;flex:none !important;box-sizing:border-box !important}
#tree .tree-lv > .tree-children{width:100% !important}
#treeExtra{display:flex !important;flex-direction:column !important;align-items:stretch !important;gap:0 !important;height:auto !important;min-height:0 !important}
#treeExtra > .tree-node{height:30px !important;min-height:30px !important;max-height:30px !important;flex:none !important;margin:0 !important;box-sizing:border-box !important}
#tree .tree-ch > .tree-node.tree-ch,
#tree .tree-children > .tree-ch > .tree-node{
  height:27px !important;
  min-height:27px !important;
  max-height:27px !important;
  flex:0 0 27px !important;
  padding-top:3px !important;
  padding-bottom:3px !important;
  box-sizing:border-box !important;
}
/* 滚动条美化：细、浅、不抢眼 */
.content::-webkit-scrollbar,
.sidebar-inner::-webkit-scrollbar,
.edit-modal::-webkit-scrollbar,
.settings-modal::-webkit-scrollbar,
.table-wrap::-webkit-scrollbar{
  width:10px;
  height:10px;
}
.content::-webkit-scrollbar-thumb,
.sidebar-inner::-webkit-scrollbar-thumb,
.edit-modal::-webkit-scrollbar-thumb,
.settings-modal::-webkit-scrollbar-thumb,
.table-wrap::-webkit-scrollbar-thumb{
  background:rgba(138,128,114,.25);
  border-radius:10px;
  border:3px solid transparent;
  background-clip:content-box;
}
.content::-webkit-scrollbar-thumb:hover,
.sidebar-inner::-webkit-scrollbar-thumb:hover,
.edit-modal::-webkit-scrollbar-thumb:hover,
.settings-modal::-webkit-scrollbar-thumb:hover,
.table-wrap::-webkit-scrollbar-thumb:hover{
  background:rgba(138,128,114,.45);
  background-clip:content-box;
  border:3px solid transparent;
}
.content::-webkit-scrollbar-track,
.sidebar-inner::-webkit-scrollbar-track,
.edit-modal::-webkit-scrollbar-track,
.settings-modal::-webkit-scrollbar-track,
.table-wrap::-webkit-scrollbar-track{
  background:transparent;
}
/* 富文本编辑区 */
.qans-wysiwyg {
  width: 100%;
  margin-top: 6px;
  padding: 10px 12px;
  font-size: 13.5px;
  line-height: 1.8;
  border: 1px solid var(--plum);
  border-radius: 7px;
  background: #F7FBF9;
  color: var(--ink);
  min-height: 80px;
  outline: none;
  white-space: pre-wrap;
  word-break: break-word;
}
.qans-wysiwyg:focus {
  border-color: var(--blue-deep);
  box-shadow: 0 0 0 2px rgba(47,94,140,.1);
}

/* 点击公式变成代码输入框 */
.math-editor-input {
  font-family: var(--mono);
  font-size: 13px;
  padding: 6px 8px;
  border: 1px solid var(--blue);
  border-radius: 4px;
  outline: none;
  background: #fff;
  color: var(--blue-deep);
  resize: none;        
  overflow: hidden;    
  line-height: 1.5;
  word-break: break-all; /* 👈 允许长单词强行折行 */
  white-space: pre-wrap; /* 👈 保留空格并允许自动换行 */
  box-sizing: border-box; /* 👈 防止 padding 撑破 100% 宽度 */
  margin: 4px 0;
}
/* 1. 解决 \\ 换行间距：给 KaTeX 的表格单元格加安全的内边距 */
.qans .katex .mtable .mtd {
  padding-top: 12px !important;    /* 👈 数值越大，\\ 换行间距越大 */
  padding-bottom: 12px !important; 
}

<script>

/* 从章节名提取序号用于排序 */
function chapterOrder(name){
  const s = String(name || "");
  const cn = { "一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,
               "十一":11,"十二":12,"十三":13,"十四":14,"十五":15,"十六":16,
               "十七":17,"十八":18,"十九":19,"二十":20 };

  // 优先中文数字（"第一章""专题一"）
  const two = s.match(/[一二三四五六七八九十]{2}/);
  if(two && cn[two[0]]) return cn[two[0]];

  const one = s.match(/[一二三四五六七八九十]/);
  if(one && cn[one[0]]) return cn[one[0]];

  // 次选阿拉伯数字（"第 3 章""专题 5"）
  const num = s.match(/\d+/);
  if(num) return parseInt(num[0], 10);

  return 999;   // 无序号排最后
}
/* 自然排序：把字符串切成"数字段 / 非数字段"，逐段比较 */
function naturalCompare(a, b){
  a = String(a || "");
  b = String(b || "");

  /* 用正则切成 [文字, 数字, 文字, 数字, ...] */
  const split = (s) => s.match(/(\d+|\D+)/g) || [];
  const sa = split(a);
  const sb = split(b);

  const len = Math.min(sa.length, sb.length);
  for(let i = 0; i < len; i++){
    const xa = sa[i];
    const xb = sb[i];
    const na = /^\d+$/.test(xa);
    const nb = /^\d+$/.test(xb);

    if(na && nb){
      /* 都是数字：按数值比 */
      const va = parseInt(xa, 10);
      const vb = parseInt(xb, 10);
      if(va !== vb) return va - vb;
      /* 数值相同 → 按长度比（"01" < "1"） */
      if(xa.length !== xb.length) return xa.length - xb.length;
    } else {
      /* 至少一个非数字 → 按 Unicode 比 */
      if(xa !== xb){
        /* 中文用拼音比（更符合直觉） */
        const hasCn = /[\u4e00-\u9fa5]/.test(xa + xb);
        if(hasCn) return xa.localeCompare(xb, "zh");
        return xa < xb ? -1 : 1;
      }
    }
  }
  return sa.length - sb.length;
}
function rebuildIndex(){
  const src = store.settings.activeSource || "";
  QS = src ? QS_ALL.filter(q => q.source === src) : QS_ALL;

  CHAPTERS_BY_MODULE = {};
  MODULE_OF_CHAPTER = {};

  TYPES_BY_CHAPTER_LEVEL = {};
  SOURCES_BY_SERIES = {};
  TOPICS_BY_CHAPTER = {};

  for(const m of MODULES) CHAPTERS_BY_MODULE[m] = [];

    if(!CHAPTERS_BY_MODULE[q.module]) CHAPTERS_BY_MODULE[q.module] = [];
    if(!CHAPTERS_BY_MODULE[q.module].includes(q.chapter)) CHAPTERS_BY_MODULE[q.module].push(q.chapter);
    MODULE_OF_CHAPTER[q.chapter] = q.module;
    if(!QUESTIONS_BY_CHAPTER[q.chapter]) QUESTIONS_BY_CHAPTER[q.chapter] = [];
    QUESTIONS_BY_CHAPTER[q.chapter].push(q);
    if(q.level){
      if(!LEVELS_BY_CHAPTER[q.chapter]) LEVELS_BY_CHAPTER[q.chapter] = [];
      if(!LEVELS_BY_CHAPTER[q.chapter].includes(q.level)) LEVELS_BY_CHAPTER[q.chapter].push(q.level);
      if(q.type){
        if(!TYPES_BY_CHAPTER_LEVEL[q.chapter]) TYPES_BY_CHAPTER_LEVEL[q.chapter] = {};
        const m2 = TYPES_BY_CHAPTER_LEVEL[q.chapter];
        if(!m2[q.level]) m2[q.level] = [];
        if(!m2[q.level].includes(q.type)) m2[q.level].push(q.type);
      }
    }
  }
  // 非 880 来源的题型索引
  const topicSeen = {};
  QS.forEach(q => {
    if(q.sourceKey === "80" || !q.topicKey) return;
    const chKey = q.moduleKey + q.chapterKey;
    if(!topicSeen[chKey]) topicSeen[chKey] = new Set();
    topicSeen[chKey].add(q.topicKey);
  });
  Object.keys(topicSeen).forEach(chKey => {
    TOPICS_BY_CHAPTER[chKey] = Array.from(topicSeen[chKey])
      .sort()
      .map(k => ({ key: k, name: topicName(chKey[0], chKey[1], k) }));
  });  
    // 套卷视图用：系列 → 存在的 SS 列表
  SOURCE_GROUPS.forEach(g => {
    if(!g.nested) return;
    const list = [];
    for(let i = 0; i < g.count; i++){
      const ss = String(g.start + i).padStart(2, "0");
      const has = QS.some(q => q.sourceKey === ss);
      if(has) list.push(ss);
    }
    if(list.length) SOURCES_BY_SERIES[g.series] = list;
  });

    // 章节按题号第 3 位（章节号）排序
  // 章节按标题里的序号排序（支持"第N章""专题N""专题一"）
  Object.keys(CHAPTERS_BY_MODULE).forEach(m => {
    CHAPTERS_BY_MODULE[m].sort((a, b) => chapterOrder(a) - chapterOrder(b));
  });
  Object.keys(LEVELS_BY_CHAPTER).forEach(ch => {
    LEVELS_BY_CHAPTER[ch].sort((a,b) => {
      const ia = LEVELS.indexOf(a), ib = LEVELS.indexOf(b);
      if(ia >= 0 && ib >= 0) return ia - ib;
      if(ia >= 0) return -1;
      if(ib >= 0) return 1;
      return 0;
    });
    const byLevel = TYPES_BY_CHAPTER_LEVEL[ch] || {};
    Object.keys(byLevel).forEach(lv => {
      byLevel[lv].sort((a,b) => {
        const ia = TYPES.indexOf(a), ib = TYPES.indexOf(b);
        if(ia >= 0 && ib >= 0) return ia - ib;
        if(ia >= 0) return -1;
        if(ib >= 0) return 1;
        return 0;
      });
    });
  });
}

async function fetchFromGithub() {
  if (!githubConfig) return false;
  const { owner, repo, path, progressPath, branch, token } = githubConfig;
  
  // --- 1. 拉取题库 ---
  try {
    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`, {
      headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
    });
    if (res.ok) {
      const data = await res.json();
      let content = "";
      if (data.encoding === "none" || !data.content) {
          const rawRes = await fetch(data.download_url);
          content = await rawRes.text();
      } else {
          const binary = atob(data.content.replace(/\s/g, ''));
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          content = new TextDecoder("utf-8").decode(bytes);
      }
      githubConfig.sha = data.sha; 
      
      const parsed = parseQuestionsCsv(content);
      if (parsed.length > 0) {
        QS_ALL = parsed;
        rebuildIndex();
        refreshSourceDropdown();
      }
    }
  } catch (e) {
    console.error("拉取题库失败:", e);
  }

  // --- 2. 拉取进度 ---
  if(progressPath) {
    try {
      const resP = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${progressPath}?ref=${branch}`, {
        headers: { "Authorization": `Bearer ${token}`, "Accept": "application/vnd.github.v3+json" }
      });
      if (resP.ok) {
        const dataP = await resP.json();
        githubConfig.progressSha = dataP.sha;
        
        let contentP = "";
        if (dataP.encoding === "none" || !dataP.content) {
            const rawRes = await fetch(dataP.download_url);
            contentP = await rawRes.text();
        } else {
            const binary = atob(dataP.content.replace(/\s/g, ''));
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            contentP = new TextDecoder("utf-8").decode(bytes);
        }
        
        // 解析并恢复进度
        parseProgressCsvText(contentP);
      }
    } catch(e) {
      console.error("拉取进度失败（如果文件不存在则忽略）:", e);
    }
  }

  saveGithubConfig(githubConfig);
  refreshCurrentView();
  toast("云端数据已同步！");
  return true;
}

async function writeToGithub(csvContent, isProgress = false) {
  if (!githubConfig) return false;
  const { owner, repo, path, progressPath, branch, token } = githubConfig;
  const targetPath = isProgress ? progressPath : path;
  const targetSha = isProgress ? githubConfig.progressSha : githubConfig.sha;
  
  if(!targetPath) return false;

  const base64Content = btoa(encodeURIComponent(csvContent).replace(/%([0-9A-F]{2})/g, function(match, p1) {
    return String.fromCharCode('0x' + p1);
  }));

  try {
    const body = {
      message: isProgress ? "Auto update progress via Web UI" : "Auto update questions via Web UI",
      content: base64Content,
      branch: branch
    };
    if(targetSha) body.sha = targetSha; // 如果文件已存在，必须带上 sha 覆盖

    const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${targetPath}`, {
      method: "PUT",
      headers: { 
        "Authorization": `Bearer ${token}`, 
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(body)
    });
    
    if (!res.ok) {
      const errData = await res.json();
      throw new Error(errData.message || "写入失败");
    }
    
    const data = await res.json();
    if(isProgress) {
      githubConfig.progressSha = data.content.sha;
    } else {
      githubConfig.sha = data.content.sha;
    }
    saveGithubConfig(githubConfig);
    return true;
  } catch (e) {
    console.error("GitHub 同步失败：", e);
    return false;
  }
}

function fillTopicTextDatalist(chapter, currentValue){
  const sel = $("#editTopicText");
  if(!sel) return;

  /* 按来源分组收集本章节用过的所有考点 */
  const bySource = {};
  QS_ALL.forEach(q => {
    if(!q.chapter || q.chapter !== chapter) return;
    // 知识点 = topic 优先；非 880 来源 topic 空时用 groups[0] 兜底
    let t = (q.topic || "").trim();
    if(!t && q.source !== "880" && q.groups && q.groups[0]) t = q.groups[0].trim();
    if(!t) return;
    if(!bySource[q.source]) bySource[q.source] = new Set();
    bySource[q.source].add(t);
  });

  const cur = String(currentValue || "").trim();

  /* 来源展示顺序：XDF → 辅导讲义 → 880 → 其他 */
  const sourceOrder = ["XDF", "辅导讲义", "880"];
  const sources = Object.keys(bySource).sort((a, b) => {
    const ia = sourceOrder.indexOf(a), ib = sourceOrder.indexOf(b);
    if(ia >= 0 && ib >= 0) return ia - ib;
    if(ia >= 0) return -1;
    if(ib >= 0) return 1;
    return a.localeCompare(b, "zh");
  });

  /* 拼 HTML：默认项 + 各来源 optgroup */
  let html = '<option value="">（不分类）</option>';
  const allTopics = [];

  sources.forEach(src => {
    const list = Array.from(bySource[src]).sort((a, b) => {
      const oa = topicOrder(a), ob = topicOrder(b);
      if(oa !== ob) return oa - ob;
      return a.localeCompare(b, "zh");
    });
    list.forEach(t => allTopics.push(t));
    html += '<optgroup label="' + esc(src) + '">';
    list.forEach(t => {
      html += '<option value="' + esc(t) + '">' + esc(t) + '</option>';
    });
    html += '</optgroup>';
  });

  /* 当前值不在任何来源里 → 补一条，避免被清空 */
  if(cur && !allTopics.includes(cur)){
    html += '<optgroup label="当前值">';
    html += '<option value="' + esc(cur) + '">' + esc(cur) + '（自定义）</option>';
    html += '</optgroup>';
  }

  html += '<option value="__custom__">✏️ 手动输入…</option>';
  sel.innerHTML = html;
  sel.value = cur;
  sel.dataset.prev = cur;

  /* 只绑一次"手动输入"事件 */
  if(!sel._bound){
    sel._bound = true;
    sel.addEventListener("change", () => {
      if(sel.value === "__custom__"){
        const v = prompt("请输入自定义考点：", sel.dataset.prev || "");
        if(v !== null && v.trim()){
          const val = v.trim();
          if(!Array.from(sel.options).some(o => o.value === val)){
            const opt = document.createElement("option");
            opt.value = val;
            opt.textContent = val + "（自定义）";
            const customOpt = sel.querySelector('option[value="__custom__"]');
            sel.insertBefore(opt, customOpt);
          }
          sel.value = val;
          sel.dataset.prev = val;
        } else {
          sel.value = sel.dataset.prev || "";
        }
      } else {
        sel.dataset.prev = sel.value;
      }
    });
  }
}

/* 提取"题型X"里的序号用于排序 */
function topicOrder(name){
  const s = String(name || "");
  const cn = { "一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9,"十":10,
               "十一":11,"十二":12,"十三":13,"十四":14,"十五":15,"十六":16,
               "十七":17,"十八":18,"十九":19,"二十":20 };

  // 优先匹配"题型X"里的序号（X 可以是汉字或阿拉伯数字）
  const m = s.match(/题型\s*([一二三四五六七八九十]{1,2}|\d+)/);
  if(m){
    if(/^\d+$/.test(m[1])) return parseInt(m[1], 10);
    return cn[m[1]] || 900;
  }
  // 没有"题型X"前缀 → 兜底
  const cnm = s.match(/[一二三四五六七八九十]{1,2}/);
  if(cnm && cn[cnm[0]]) return cn[cnm[0]];
  const num = s.match(/\d+/);
  if(num) return parseInt(num[0], 10);
  return 900;
}
/* 取题型名 */
function topicName(moduleKey, chapterKey, topicKey){
  const m = TOPIC_MAP[moduleKey + chapterKey];
  return (m && m[topicKey]) || ("题型" + topicKey);
}
const Q_MODULE_NAME = { "1": "微积分", "2": "线性代数", "3": "概率论" };
const Q_LEVEL_NAME  = { "1": "基础题", "2": "综合题", "3": "拓展题" };
const Q_TYPE_NAME   = { "1": "选择题", "2": "填空题", "3": "解答题" };

function decodeQid(id){
  if(typeof id !== "string" || id.length !== 8 || !/^\d+$/.test(id)) return null;
  const ss = id.slice(0, 2);
  const m  = id[2];
  const c  = id[3];
  const source  = Q_SOURCE_NAME[ss];
  const module  = Q_MODULE_NAME[m];
  const chapter = CHAPTER_MAP[m] && CHAPTER_MAP[m][c];
  if(!source || !module || !chapter) return null;
  const no = parseInt(id.slice(6), 10);

  if(ss === "80"){
    /* 880：L=难度、T=选填解 */
    const level = Q_LEVEL_NAME[id[4]];
    const type  = Q_TYPE_NAME[id[5]];
    if(!level || !type) return null;
    return { source, sourceKey: ss, moduleKey: m, chapterKey: c,
             module, chapter, level, type, no, topicKey: "" };
  } else {
    /* 其他：K K = 题型编号 */
    const topicKey = id.slice(4, 6);
    return { source, sourceKey: ss, moduleKey: m, chapterKey: c,
             module, chapter, level: "—", type: "—", no, topicKey };
  }
}

/* --- 解析 / 构建 --- */
function parseQuestionsCsv(text){
  const rows = parseCsv(text);
  if(!rows.length) return [];
  const hdr = rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, ""));
  const idx = (...names) => {
    for(const n of names){
      const i = hdr.indexOf(n);
      if(i >= 0) return i;
    }
    return -1;
  };

  const ci = {
    id: idx("题号id","id"),
    source: idx("来源","source"),
    module: idx("模块","module"),
    chapter: idx("章节","chapter"),
    paper: idx("套卷","paper"),
    seq: idx("序号","seq"),    
    g1: idx("难度","group1"),
    g2: idx("选填解","group2"),
    topic: idx("题型","topic"),
    content: idx("题目内容","content"),
    a: idx("选项a","option_a"),
    b: idx("选项b","option_b"),
    c: idx("选项c","option_c"),
    d: idx("选项d","option_d"),
    ans: idx("解析","answer")
  };
  if(ci.content < 0){ console.warn("[import] 缺少题目内容列"); return []; }
  if(ci.source < 0 || ci.module < 0 || ci.chapter < 0){
    console.warn("[import] 缺少来源/模块/章节列，无法解析");
    return [];
  }

  const out = [];
  const counters = {};
  const autoIds = {};

  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    const content = String(r[ci.content] || "").trim();
    if(!content) continue;

    const source  = String(r[ci.source] || "").trim();
    const module  = normalizeModule(String(r[ci.module] || "").trim());
    const chapter = String(r[ci.chapter] || "").trim();
    if(!source){ console.warn("[import] 第" + (i+1) + "行缺来源，跳过"); continue; }

    let id = ci.id >= 0 ? String(r[ci.id] || "").trim() : "";
    if(!id){
      autoIds[source] = (autoIds[source] || 0) + 1;
      id = getSourcePrefix(source) + "-" + String(autoIds[source]).padStart(4, "0");
    }

    const g1v = ci.g1 >= 0 ? String(r[ci.g1] || "").trim() : "";
    const g2v = ci.g2 >= 0 ? String(r[ci.g2] || "").trim() : "";
    const topic = ci.topic >= 0 ? String(r[ci.topic] || "").trim() : "";

    // 强制一一对应，防止空列导致错位
    let level = g1v || "";
    let type  = g2v || "";
    
    const groups = [];
    if(level) groups.push(level);
    if(type) groups.push(type);
    if(!level && topic) level = topic;

    const opts = [];
    for(const k of ["a","b","c","d"]){
      if(ci[k] >= 0){
        const v = String(r[ci[k]] || "").trim();
        if(v) opts.push(v);
      }
    }

    const key = source + "|" + chapter;
    counters[key] = (counters[key] || 0) + 1;

    out.push({
      id, source, sourceKey: source,
      module, moduleKey: "",
      chapter, chapterKey: "",
      paper: ci.paper >= 0 ? String(r[ci.paper] || "").trim() : "",
      seq: ci.seq >= 0 ? String(r[ci.seq] || "").trim() : "",      
      groups, topic,
      level, type,
      no: counters[key],
      content,
      options: opts,
      answer: ci.ans >= 0 ? String(r[ci.ans] || "").trim() : ""
    });
  }
  return out;
}

function normalizeModule(m){
  const map = {
    "概率统计": "概率论"
  };
  return map[m] || m;
}

function parseLegacyCsv(rows, idx){
  const ci = {
    id: idx("题号id", "id"),
    content: idx("题目内容", "content"),
    a: idx("选项a", "option_a"),
    b: idx("选项b", "option_b"),
    c: idx("选项c", "option_c"),
    d: idx("选项d", "option_d"),
    ans: idx("解析", "answer")
  };
  if(ci.id < 0 || ci.content < 0) return [];
  const out = [];
  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    const id = String(r[ci.id] || "").trim();
    if(!id) continue;
    const decoded = decodeQid(id);
    if(!decoded){ console.warn("[880] 跳过无效题号ID:", id); continue; }
    const content = String(r[ci.content] || "").trim();
    if(!content) continue;
    const opts = [];
    for(const k of ["a","b","c","d"]){
      if(ci[k] >= 0){
        const v = String(r[ci[k]] || "").trim();
        if(v) opts.push(v);
      }
    }
    let groups = [], topic = "";
    if(id.slice(0,2) === "80"){
      groups = [decoded.level, decoded.type].filter(Boolean);
    } else {
      topic = decoded.topicKey ? topicName(decoded.moduleKey, decoded.chapterKey, decoded.topicKey) : "";
      if(topic) groups = [topic];
    }
    out.push({
      id, content, options: opts,
      answer: ci.ans >= 0 ? String(r[ci.ans] || "").trim() : "",
      ...decoded,
      groups, topic,
      level: groups[0] || "",
      type:  groups[1] || ""
    });
  }
  return out;
}

function getSourcePrefix(source){
  const map = { "880":"880", "XDF":"xdf", "概率论辅导讲义":"jc" };
  if(map[source]) return map[source];
  return (source.replace(/[^\x00-\x7F]/g, "").slice(0, 3).toLowerCase() || "q");
}

function buildQuestionsCsv(){
const rows = [["题号ID","来源","模块","章节","套卷","序号","难度","选填解","题型","题目内容","选项A","选项B","选项C","选项D","解析"]];
  for(const q of QS_ALL){
    const g = q.groups || [];
    rows.push([
      q.id, q.source || "", q.module || "", q.chapter || "",
      q.paper || "",
      q.seq || "",          // ← 新增
      g[0] || "", g[1] || "", q.topic || "",
      q.content || "",
      (q.options && q.options[0]) || "",
      (q.options && q.options[1]) || "",
      (q.options && q.options[2]) || "",
      (q.options && q.options[3]) || "",
      q.answer || ""
    ]);
  }
  return rows.map(r => r.map(cell => {
    const s = String(cell == null ? "" : cell);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
}

function loadStore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && typeof d === "object"){
        if(d.progress && typeof d.progress === "object") store.progress = d.progress;
        if(d.tags && typeof d.tags === "object") store.tags = d.tags;
        if(d.notes && typeof d.notes === "object") store.notes = d.notes;
        if(d.settings && typeof d.settings === "object") Object.assign(store.settings, d.settings);
        if(!store.settings.treeState) store.settings.treeState = {};
        if(d.session && typeof d.session === "object") store.session = d.session;
      }
    }
    store.meta.version = 2;
  }catch(e){}
}
function saveStore(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
  catch(e){}
}
function touchStore(){ store.meta.lastModified = Date.now(); }
function toTimestamp(v){
  if(typeof v === "number" && isFinite(v)) return v;
  if(typeof v === "string"){ const t = Date.parse(v); return isNaN(t) ? 0 : t; }
  return 0;
}
/* ============================================================
   学习记录：每个题记录最近 5 次学习结果
   数据结构：store.progress[qid] = ["f", "v", "f", "u", "f"]
   - 字符串形式（旧数据）也兼容，读作单条记录
   ============================================================ */
const REC_MAX = 5;

function recordsOf(qid){
  const v = store.progress[String(qid)];
  if(!v) return [];
  if(typeof v === "string") return STATES[v] ? [v] : [];
  if(Array.isArray(v)) return v.filter(x => STATES[x]).slice(-REC_MAX);
  return [];
}

function stateOf(qid){
  const r = recordsOf(qid);
  return r.length ? r[r.length - 1] : "";
}

function setState(qid, s){
  qid = String(qid);
  if(!s || !STATES[s]){
    delete store.progress[qid];
  } else {
    let arr = recordsOf(qid);
    arr.push(s);
    arr = arr.slice(-REC_MAX);
    store.progress[qid] = arr;
  }
  touchStore(); saveStore(); autoSync();
}
function getTags(qid){ return store.tags[String(qid)] || []; }
function addTag(qid, name){
  qid = String(qid);
  name = (name || "").trim().replace(/\s+/g, " ");
  if(!name) return;
  if(!store.tags[qid]) store.tags[qid] = [];
  if(store.tags[qid].includes(name)) return;
  store.tags[qid].push(name);
  touchStore(); saveStore(); autoSync();
}
function removeTag(qid, name){
  qid = String(qid);
  if(!store.tags[qid]) return;
  store.tags[qid] = store.tags[qid].filter(t => t !== name);
  if(!store.tags[qid].length) delete store.tags[qid];
  touchStore(); saveStore(); autoSync();
}
function getNote(qid){ const n = store.notes[String(qid)]; return n && typeof n === "object" ? n.text || "" : ""; }
function setNote(qid, text){
  qid = String(qid); text = String(text || "").trim();
  if(!text) delete store.notes[qid];
  else store.notes[qid] = { text, updatedAt: Date.now() };

}

/* ===== 数学渲染 ===== */
function splitMath(text){
  const parts = []; const chars = Array.from(text);
  let buf = "", i = 0;
  const flush = () => { if(buf){ parts.push({type:"text", value:buf}); buf = ""; } };
  while(i < chars.length){
    if(chars[i] === "$"){
      if(chars[i+1] === "$"){
        flush();
        let end = -1;
        for(let j = i+2; j < chars.length-1; j++) if(chars[j] === "$" && chars[j+1] === "$"){ end = j; break; }
        if(end === -1){ buf += "$$"; i += 2; continue; }
        parts.push({type:"math", display:true, value:chars.slice(i+2,end).join("")});
        i = end + 2;
      } else {
        flush();
        let end = -1;
        for(let j = i+1; j < chars.length; j++) if(chars[j] === "$"){ end = j; break; }
        if(end === -1){ buf += "$"; i++; continue; }
        parts.push({type:"math", display:false, value:chars.slice(i+1,end).join("")});
        i = end + 1;
      }
      continue;
    }
    buf += chars[i]; i++;
  }
  flush(); return parts;
}
function renderMathEl(container, math, display){
  const span = document.createElement(display ? "div" : "span");
  span.className = display ? "math-block" : "math-inline";
  
  span.dataset.tex = math;
  span.contentEditable = "false";
  
  let renderMath = math;
  
  // 如果公式中包含换行符 \\
  if (renderMath.includes('\\\\')) {
      // 1. 如果公式里没有使用任何 \begin{ 环境（说明是裸写换行）
      if (!/\\begin\{/.test(renderMath)) {
          // 自动把所有 \\ 替换为带 1.5em 间距的换行
          let temp = renderMath.replace(/\\\\(?!\[|\*)/g, '\\\\[1.5em]');
          
          if (temp.includes('&')) {
              // 如果原文有 & 对齐符，用 aligned 环境
              renderMath = '\\begin{aligned}' + temp + '\\end{aligned}';
          } else {
              // 👇 如果没写 &，用 array 环境强制左对齐 (l 代表 left)
              renderMath = '\\begin{array}{l}' + temp + '\\end{array}';
          }
      } else {
          // 2. 如果已经用了环境（如 aligned, cases 等），只强制加大换行间距
          renderMath = renderMath.replace(/\\\\(?!\[|\*)/g, '\\\\[1.5em]');
      }
  }

  try{ 
    katex.render(renderMath, span, { displayMode: display, throwOnError: false, strict: false }); 
  }
  catch(e){ 
    span.textContent = math; 
  }
  container.appendChild(span);
}

/* 判断一行是否是图片（Markdown 或 HTML img） */
function extractImage(line){
  const t = line.trim();
  if(!t) return null;

  /* Markdown: ![alt](url) 或 ![alt](url "title") */
  const md = t.match(/^!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)$/);
  if(md) return { alt: md[1], src: md[2] };

  /* HTML: <img src="..." alt="..."> */
  const html = t.match(/^<img\s+([^>]+)\/?>$/i);
  if(html){
    const srcM = html[1].match(/src\s*=\s*["']([^"']+)["']/i);
    const altM = html[1].match(/alt\s*=\s*["']([^"']*)["']/i);
    if(srcM) return { alt: altM ? altM[1] : "", src: srcM[1] };
  }
  return null;
}

function renderImage(container, img){
  const wrap = document.createElement("span");
  wrap.className = "md-image-wrap";
  const el = document.createElement("img");
  el.src = img.src;
  el.alt = img.alt || "";
  el.loading = "lazy";
  el.className = "md-image";
  el.title = "点击查看大图";
  el.addEventListener("click", () => window.open(img.src, "_blank"));
  el.addEventListener("error", () => {
    wrap.innerHTML = "";
    const fallback = document.createElement("span");
    fallback.className = "md-image-fallback";
    fallback.textContent = "🖼 图片加载失败：" + (img.alt || img.src);
    wrap.appendChild(fallback);
  });
  wrap.appendChild(el);
  container.appendChild(wrap);
}
/* ===== 渲染入口：先按行识别 Markdown 表格，其余交给行内渲染 ===== */
function renderContentTo(container, text){
  const lines = String(text).split("\n");
  let i = 0;
  let buf = [];

  const flushBuf = () => {
    if(!buf.length) return;
    renderInlineWithMath(container, buf.join("\n"));
    buf = [];
  };

  while(i < lines.length){
    /* 图片行：连续图片合并成一行 */
    const img = extractImage(lines[i]);
    if(img){
      flushBuf();
      /* 收集连续的图片行 */
      const imgGroup = [];
      while(i < lines.length){
        const im = extractImage(lines[i]);
        if(!im) break;
        imgGroup.push(im);
        i++;
      }
      if(imgGroup.length === 1){
        renderImage(container, imgGroup[0]);
      } else {
        const row = document.createElement("div");
        row.className = "md-image-row";
        imgGroup.forEach(im => renderImage(row, im));
        container.appendChild(row);
      }
      continue;
    }

    /* Markdown 表格 */
    if(isTableLine(lines[i]) && i + 1 < lines.length && isSeparatorLine(lines[i + 1])){
      flushBuf();
      const tableLines = [lines[i]];
      i++;
      while(i < lines.length && isTableLine(lines[i])){
        tableLines.push(lines[i]);
        i++;
      }
      renderMarkdownTable(container, tableLines);
    } else {
      buf.push(lines[i]);
      i++;
    }
  }
  flushBuf();
}

/* ===== 原来的渲染逻辑（文本 + $...$） ===== */
function renderInlineWithMath(container, text){
  const parts = splitMath(text);
  parts.forEach((p, i) => {
    if(p.type !== "text") return;
    const prev = parts[i-1], next = parts[i+1];
    if(prev && prev.type === "math" && prev.display) p.value = p.value.replace(/^\n/, "");
    if(next && next.type === "math" && next.display) p.value = p.value.replace(/\n$/, "");
  });
  for(const p of parts){
    if(p.type === "math") renderMathEl(container, p.value, p.display);
    else {
      if(!p.value) continue;
      const lines = p.value.split("\n");
      lines.forEach((ln, idx) => {
        if(idx > 0) container.appendChild(document.createElement("br"));
        container.appendChild(document.createTextNode(ln.replace(/\\(?=_)/g, "")));
      });
    }
  }
}

/* ===== Markdown 表格识别 ===== */
function isTableLine(line){
  const t = line.trim();
  return t.length > 1 && t.startsWith("|") && t.endsWith("|");
}
function isSeparatorLine(line){
  const t = line.trim();
  if(!t.startsWith("|") || !t.endsWith("|")) return false;
  const inner = t.slice(1, -1);
  if(!inner.includes("-")) return false;
  const cells = inner.split("|");
  return cells.every(c => /^\s*:?-+:?\s*$/.test(c));
}
function renderMarkdownTable(container, lines){
  const wrap = document.createElement("div");
  wrap.className = "md-table-wrap";

  const table = document.createElement("table");
  table.className = "md-table";

  const parseRow = (line) => {
    const t = line.trim();
    const inner = t.slice(1, -1);
    return inner.split("|").map(c => c.trim());
  };

  const headerCells = parseRow(lines[0]);
  const bodyLines = lines.slice(2);   // 跳过第 2 行的分隔线

  /* 表头 */
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headerCells.forEach(c => {
    const th = document.createElement("th");
    renderContentTo(th, c);           // 递归，单元格里若有 $x$ 也能渲染
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  table.appendChild(thead);

  /* 表体 */
  const tbody = document.createElement("tbody");
  bodyLines.forEach(line => {
    const cells = parseRow(line);
    const tr = document.createElement("tr");
    // 补齐/截断到表头列数，避免畸形
    for(let k = 0; k < headerCells.length; k++){
      const td = document.createElement("td");
      renderContentTo(td, cells[k] != null ? cells[k] : "");
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  wrap.appendChild(table);
  container.appendChild(wrap);
}

function renderSetTree(){
  const tree = $("#tree");
  tree.innerHTML = "";

  /* 按来源 → 套卷 分组（只统计 paper 非空的题） */
  const bySource = {};
  QS.forEach(q => {
    if(!q.paper) return;
    if(!bySource[q.source]) bySource[q.source] = {};
    bySource[q.source][q.paper] = (bySource[q.source][q.paper] || 0) + 1;
  });

  const sources = Object.keys(bySource);
  if(!sources.length){
    const empty = document.createElement("div");
    empty.style.cssText = "padding:20px 14px;color:var(--ink-3);font-size:12.5px;line-height:1.7";
    empty.textContent = "暂无套卷数据。给题目填入「套卷」列即可显示。";
    tree.appendChild(empty);
    return;
  }

  /* 来源排序：真题 → 模拟卷 → 其他 */
  const order = ["真题", "模拟卷"];
  sources.sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if(ia >= 0 && ib >= 0) return ia - ib;
    if(ia >= 0) return -1;
    if(ib >= 0) return 1;
    return a.localeCompare(b, "zh");
  });

}
function renderTopicTree(){

    if(!treeData[mod]) treeData[mod] = {};
    if(!treeData[mod][ch]) treeData[mod][ch] = {};
