/* ===== 题目列表 ===== */
const PAGE_SIZE = 60;
let listState = { title: "", subtitle: "", list: [], rendered: 0, filter: { tag: "" } };
function buildListFromSel(sel){
  let list = QS;
  let titleParts = [];
  
  if(sel.view === "topic"){
    list = list.filter(q => q.paper);
  }

  // 模块过滤（兼容“未分类”）
  if(sel.module){
    if(sel.module === "未分类" || sel.module === "未分类模块"){
      list = list.filter(q => !q.module);
    } else {
      list = list.filter(q => q.module === sel.module);
    }
    titleParts.push(sel.module);
  }
  
  // 章节过滤（兼容“未分类”）
  if(sel.chapter){
    if(sel.chapter === "未分类" || sel.chapter === "未分类章节"){
      list = list.filter(q => !q.chapter);
    } else {
      list = list.filter(q => q.chapter === sel.chapter);
    }
    titleParts.push(sel.chapter);
  }
  
  // 知识点过滤（兼容“未分类”）
  if(sel.topic){
    if(sel.topic === "未分类" || sel.topic === "未分类知识点"){
      list = list.filter(q => !q.topic);
    } else {
      list = list.filter(q => (q.topic || "未分类知识点") === sel.topic);
    }
    titleParts.push(sel.topic);
  }
  
  if(sel.paper){ list = list.filter(q => q.paper === sel.paper); titleParts.push(sel.paper); }
  if(sel.level){ list = list.filter(q => q.level === sel.level); titleParts.push(sel.level); }
  if(sel.type){ list = list.filter(q => q.type === sel.type); titleParts.push(sel.type); }
  if(sel.sourceKey){ list = list.filter(q => q.source === sel.sourceKey || q.sourceKey === sel.sourceKey); titleParts.push(sel.sourceKey); }

  // 获取题型（用于排序）
  const getQType = (q) => {
    const t = q.type || (q.groups && q.groups.length > 1 ? q.groups[1] : "");
    if (t) return t;
    if (q.level && ["选择题","填空题","解答题"].includes(q.level)) return q.level;
    return "";
  };

  // 排序逻辑
  if (sel.view === "topic") {
    list.sort((a, b) => {
      const typeA = getQType(a);
      const typeB = getQType(b);
      const typeOrder = { "选择题": 1, "填空题": 2, "解答题": 3 };
      const ta = typeOrder[typeA] || 9;
      const tb = typeOrder[typeB] || 9;
      
      if (ta !== tb) return ta - tb;

      const na = parseInt(a.seq || a.no) || 0;
      const nb = parseInt(b.seq || b.no) || 0;
      if (na !== nb) return na - nb;
      
      return (a.paper || "").localeCompare(b.paper || "", "zh");
    });
  } else {
    list.sort((a, b) => {
      if (a.paper && b.paper) {
        if (a.paper !== b.paper) return a.paper.localeCompare(b.paper, "zh");
        const na = parseInt(a.seq || a.no) || 0;
        const nb = parseInt(b.seq || b.no) || 0;
        return na - nb;
      }
      if (a.paper) return -1;
      if (b.paper) return 1;
      return 0;
    });
  }

  return { list, title: titleParts.join(" · ") || "全部题目" };
}

function gotoList(sel){
  const { list, title } = buildListFromSel(sel);
  activeNode = {
    module: sel.module || "", chapter: sel.chapter || "",

    sourceKey: sel.sourceKey || "",
    paper: sel.paper || "",
    moduleKey: sel.moduleKey || "", chapterKey: sel.chapterKey || "",
    topicKey: sel.topicKey || "",
    topic: sel.topic || "", // 新增
    view: sel.view || ""    // 新增
  };
  if(sel.chapter){ store.settings.lastChapter = sel.chapter; touchStore(); saveStore(); }
  const subtitle = sel.chapter ? "章节 · " + (MODULE_OF_CHAPTER[sel.chapter]||"") : (sel.module ? "模块" : "");
  renderListView(title, subtitle, list, sel);

function renderTagBar(container, chapter, tagList){
  container.innerHTML = "";

      renderTagBar(container, chapter, tagList);
      renderNextBatch();
      updateLoadmore();
    });

    more.className = "tb-more";

    });
    container.appendChild(more);
  }
}
function applyTagFilter(list){
  let out = list;
  if(listState.filter.state){
    if(listState.filter.state === "_none"){
      out = out.filter(q => !stateOf(q.id));
    } else {
      out = out.filter(q => stateOf(q.id) === listState.filter.state);
    }
  }
  if(listState.filter.note){
    out = out.filter(q => hasNote(q.id));
  }
  if(listState.filter.tag){
    out = out.filter(q => getTags(q.id).includes(listState.filter.tag));
  }
  return out;
}
function currentFilteredList(){ return applyTagFilter(listState.list); }

/* 取题目在正文里展示用的"题型名" */
function qTopicOf(q){
  if(!q) return "";

  return q.topicKey
    ? topicName(q.moduleKey, q.chapterKey, q.topicKey)

function renderNextBatch(){
  const wrap = $("#qlistEl");
  if(!wrap) return;
  const filtered = currentFilteredList();
  const slice = filtered.slice(listState.rendered, listState.rendered + PAGE_SIZE);
  const frag = document.createDocumentFragment();

  const chapterSet = new Set(filtered.map(q => q.chapter));
  const multiChapter = chapterSet.size > 1;
  let prevQ = listState.rendered > 0 ? filtered[listState.rendered - 1] : null;

slice.forEach(q => {
  const chapterChanged = !prevQ || prevQ.chapter !== q.chapter;
  const levelChanged   = !prevQ || chapterChanged || prevQ.level !== q.level;
  const typeChanged    = !prevQ || chapterChanged || prevQ.type !== q.type;

  // 获取当前题的题型（选填解）
  const curType = q.type || (q.groups && q.groups[1]) || "";
  const prevType = prevQ ? (prevQ.type || (prevQ.groups && prevQ.groups[1]) || "") : "";

  if (listState.isTopic) {
    // === 考点模式：按选填解分块 ===
    if (curType && curType !== prevType) {
      const h = document.createElement("h3");
      h.className = "group-level"; // 借用难度的蓝底大标题样式
      h.textContent = curType;
      frag.appendChild(h);
    }
  } else if (!listState.isSet && !listState.isSearch) {
    // === 普通模式（按难度/搜索） ===
    if(multiChapter && chapterChanged){
      const h = document.createElement("h2");
      h.className = "group-chapter";
      h.textContent = q.chapter;
      frag.appendChild(h);
    }
    if(q.level && q.level !== q.chapter && levelChanged){
      const h = document.createElement("h3");
      h.className = "group-level";
      h.textContent = q.level;
      frag.appendChild(h);
    }
    if(q.type && typeChanged){
      const h = document.createElement("h4");
      h.className = "group-type";
      h.textContent = q.type;
      frag.appendChild(h);
    }
  }

  // 编号重置逻辑
  const path = (listState.isTopic || listState.isSearch || listState.isSet)
    ? "ALL" 
    : ((q.chapter || "") + "|" + ((q.groups && q.groups.length) ? q.groups.join("|") : (q.level || "") + "|" + (q.type || "")));

  if(listState.lastPath !== path){
    listState.displayNo = 1;
    listState.lastPath = path;
  } else {
    listState.displayNo++;
  }

  // 考点视图使用真实题号，其他使用连号
  const finalNo = listState.isTopic ? (q.seq || q.no) : listState.displayNo;
  
  frag.appendChild(buildQItem(q, finalNo));
  prevQ = q;
});

  wrap.appendChild(frag);
  listState.rendered += slice.length;
  updateLoadmore();
}
function updateLoadmore(){

  const filtered = currentFilteredList();
  const remain = filtered.length - listState.rendered;
  if(remain <= 0){
    if(filtered.length > PAGE_SIZE){
      const info = document.createElement("div");
      info.className = "loadmore-info";
      info.textContent = "已加载全部 " + filtered.length + " 题";
      wrap.appendChild(info);
    }
    return;
  }
  const btn = document.createElement("button");
  btn.className = "loadmore-btn";
  btn.innerHTML = '加载更多（剩余 ' + remain + ' 题）<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  btn.addEventListener("click", () => renderNextBatch());
  wrap.appendChild(btn);
}
function ensureAllRendered(){
  return new Promise(res => {
    const filtered = currentFilteredList();
    while(listState.rendered < filtered.length) renderNextBatch();
    updateLoadmore();
    res();
  });
}

/* ===== 搜索历史 ===== */
const HIST_KEY = "math880.searchHistory";
const HIST_MAX = 10;

function getSearchHistory(){
  try{
    const raw = localStorage.getItem(HIST_KEY);
    if(!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
function pushSearchHistory(kw){
  kw = String(kw || "").trim();
  if(!kw) return;
  let list = getSearchHistory();
  list = list.filter(x => x !== kw);   // 去重
  list.unshift(kw);                     // 最新的放最前
  if(list.length > HIST_MAX) list = list.slice(0, HIST_MAX);
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(list)); }catch(e){}
}
function clearSearchHistory(){
  try{ localStorage.removeItem(HIST_KEY); }catch(e){}
}

/* 构建 5 个学习记录圆圈（点击循环：空→熟悉→模糊→陌生→空） */
function buildRecordsUI(q){
  const wrap = document.createElement("span");
  wrap.className = "q-records";
  wrap.dataset.qid = q.id;

  function render(){
    wrap.innerHTML = "";
    const recs = recordsOf(q.id);
    for(let i = 0; i < REC_MAX; i++){
      const c = document.createElement("span");
      c.className = "rec-circle";
      if(recs[i]){
        c.classList.add(recs[i]);
        c.title = STATES[recs[i]].label + "（第 " + (i + 1) + " 次）— 点击切换";
      } else {
        c.title = "点击记录（空 → 熟悉 → 模糊 → 陌生 → 空）";
      }
      c.addEventListener("click", e => {
        e.stopPropagation();
        cycleRecord(q.id, i);
        render();
      });
      wrap.appendChild(c);
    }
  }
  render();
  return wrap;
}

/* 循环切换某条记录：空 → f → v → u → 空 */
function cycleRecord(qid, idx){
  const recs = recordsOf(qid).slice();   // 复制
  /* 补齐到 idx 位置 */
  while(recs.length <= idx) recs.push(null);

  const cur = recs[idx];
  let next;
  if(!cur) next = "f";
  else if(cur === "f") next = "v";
  else if(cur === "v") next = "u";
  else next = null;   // u → 空（清除这一条）

  if(next) recs[idx] = next;
  else recs[idx] = null;

  /* 清理尾部空值 + 中间空值压缩（保持前面对齐） */
  while(recs.length && !recs[recs.length - 1]) recs.pop();

  qid = String(qid);
  if(recs.length){
    store.progress[qid] = recs;
  } else {
    delete store.progress[qid];
  }
  touchStore(); saveStore(); autoSync();
}

function toggleNoteEdit(q, noteBtn){
  const el = noteBtn.closest(".qitem");
  const box = el.querySelector(".qnote-slot");

  /* 有内容且已收起 → 展开显示（不进入编辑） */
  if(hasNote(q.id) && box.classList.contains("collapsed")){
    box.classList.remove("collapsed");
    return;
  }
  /* 已展开且显示内容 → 收起 */
  if(hasNote(q.id) && !box.classList.contains("collapsed") && !box.querySelector("textarea")){
    box.classList.add("collapsed");
    return;
  }
  /* 没有内容 → 进入编辑 */
  if(box.querySelector("textarea")) return;
  box.classList.remove("collapsed");
  box.innerHTML = "";
  startNoteEdit(q, null, box, noteBtn);
}
function startNoteEdit(q, view, box, noteBtn){

  if (contentEl) {

    /* 自动拉高到内容高度 */
  function autoResize(){

  ta.addEventListener("blur", commit);
  ta.addEventListener("keydown", e => {
    e.stopPropagation();
    if(e.key === "Escape"){ saved = true; commit(); }
    if((e.ctrlKey || e.metaKey) && e.key === "Enter") commit();
  });
}
function extractSource(node) {
  let text = "";
  for (let child of node.childNodes) {
    if (child.nodeType === 3) {
      // 普通文本
      text += child.textContent.replace(/\u00A0/g, " ");
    } else if (child.nodeType === 1) {
      if (child.classList.contains("math-inline")) {
        text += "$" + (child.dataset.tex || "") + "$";
      } else if (child.classList.contains("math-block")) {
        text += "\n$$" + (child.dataset.tex || "") + "$$\n";
      } else if (child.tagName === "BR") {
        text += "\n";
      } else if (child.tagName === "TABLE") {
        // 👇 修复核心：把 HTML 表格完美还原成 Markdown 表格
        const rows = child.querySelectorAll("tr");
        let tableText = "\n";
        rows.forEach((tr, index) => {
          const cells = tr.querySelectorAll("th, td");
          let rowStr = "|";
          cells.forEach(cell => {
            // 递归提取单元格内容，如果有换行换成 <br>
            rowStr += " " + extractSource(cell).trim().replace(/\n/g, "<br>") + " |";
          });
          tableText += rowStr + "\n";
          // 第一行是表头，加分隔线
          if (index === 0) {
            tableText += "|";
            cells.forEach(() => { tableText += " --- |"; });
            tableText += "\n";
          }
        });
        text += tableText + "\n";
      } else if (child.tagName === "DIV" || child.tagName === "P") {
        // 块级元素，前后加换行
        if (text.length > 0 && !text.endsWith("\n")) text += "\n";
        text += extractSource(child);
        if (!text.endsWith("\n")) text += "\n";
      } else {
        text += extractSource(child);
      }
    }
  }
  return text;
}

async function startAnswerEdit(q, box, ansBtn, renderFn){
  const old = q.answer || "";
  box.innerHTML = "";
  
  const editorDiv = document.createElement("div");
  editorDiv.className = "qans-wysiwyg";
  editorDiv.contentEditable = "true";
  
  // 先把原本的渲染结果搬进来
  renderContentTo(editorDiv, old);
  box.appendChild(editorDiv);
  
  // 拦截公式的点击
  editorDiv.addEventListener("click", e => {
    const mathNode = e.target.closest(".math-inline, .math-block");
    if(!mathNode) return;
    if(mathNode.nextElementSibling && mathNode.nextElementSibling.classList.contains("math-editor-input")) return;
    
    const tex = mathNode.dataset.tex || "";
    const isDisplay = mathNode.classList.contains("math-block");
    
    const input = document.createElement("textarea");
    input.className = "math-editor-input";
    input.value = tex;
    input.rows = 1;
    
    // 👇 强制设为块级元素，占满整行宽度
    input.style.display = "block";
    input.style.width = "100%";
    
    // 自动撑高逻辑
    const autoResize = () => {
      input.style.height = "1px"; // 先缩小再计算，防止无限变高
      input.style.height = (input.scrollHeight) + "px";
    };
    setTimeout(autoResize, 0);
    input.addEventListener("input", autoResize);
    
    mathNode.style.display = "none";
    mathNode.parentNode.insertBefore(input, mathNode.nextSibling);
    input.focus();
    
    let finished = false;
    const finish = () => {
      if(finished) return;
      finished = true;
      const newTex = input.value.trim();
      if(newTex){
        mathNode.dataset.tex = newTex;
        try { katex.render(newTex, mathNode, { displayMode: isDisplay, throwOnError: false, strict: false }); }
        catch(err) { mathNode.textContent = newTex; }
      }
      mathNode.style.display = "";
      input.remove();
      editorDiv.focus();
    };
    
    input.addEventListener("blur", finish);
    input.addEventListener("keydown", ev => {
      // 回车直接保存并退出，Shift+回车 才换行
      if(ev.key === "Enter" && !ev.shiftKey){ ev.preventDefault(); finish(); }
      if(ev.key === "Escape"){ input.value = tex; finish(); }
    });
  });

  // 自动聚焦，并处理保存
  const contentEl = $("#content");
  const scrollPos = contentEl ? contentEl.scrollTop : 0;
  editorDiv.focus({ preventScroll: true });
  
  // 光标放到最后
  const range = document.createRange();
  range.selectNodeContents(editorDiv);
  range.collapse(false);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  
  if (contentEl) contentEl.scrollTop = scrollPos;

  let saved = false;
  const commit = async () => {
    if(saved) return;
    saved = true;
    let v = extractSource(editorDiv).trim();
    v = v.replace(/\n{3,}/g, "\n\n"); // 清理多余空行
    
    box.innerHTML = "";
    if(v !== old){
      q.answer = v;
      if(ansBtn){
        ansBtn.classList.toggle("has-ans", !!v);
        ansBtn.classList.toggle("dim", !v);
      }
      if(questionsHandle){
        const ok = await writeQuestionsToBoundCsv();
        toast(ok ? "解析已保存" : "保存失败，请检查题库绑定");
      } else {
        toast("已修改，但未绑定题库 CSV，刷新后会丢失");
      }
    }
    renderFn();
  };
  
  editorDiv.addEventListener("blur", e => {
    setTimeout(() => {
      if(!document.activeElement.classList.contains("math-editor-input") && document.activeElement !== editorDiv){
        commit();
      }
    }, 150);
  });
  
  editorDiv.addEventListener("keydown", e => {
    if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); commit(); }
  });
}

    "第五章 相似矩阵": "相似",
    "第六章 二次型": "二次型",
    
    "第一章 随机事件及其概率": "随机事件",
    "第二章 随机变量及其分布": "一维随机",
    "第三章 多维随机变量及其分布": "多维随机",
    "第四章 随机变量的数字特征": "数字特征",
    "第五章 大数定律与中心极限定理": "大数定律",
    "第六章 统计量分布与数字特征": "数理统计",
    "第七章 参数估计": "参数估计"
  };

  if (map[ch]) return map[ch];

  // 如果没有预设，就自动提取：去掉“第X章”和标点，截取前 4 个字
  let clean = ch.replace(/^第.+?章\s*/, "").replace(/[、，,\s]/g, "");
  return clean.slice(0, 4) || ch;
}

/* ===== 搜索 ===== */
let searchFilter = { sources:[], module:"", chapter:"", states:[], levels:[], types:[], tags:[] };
let searchTimer = null;

function doFullTextSearch(kw){
  kw = (kw || "").trim();
  if(!kw && !hasAnyFilter()){
    if(currentView === "list"){}
    else { renderDashboard(); showView("dashboard"); }
    return;
  }
  if(kw) pushSearchHistory(kw);
  const list = runSearch(kw);
  const title = kw ? '搜索："' + kw + '"' : "筛选结果";
  renderListView(title + "（" + list.length + " 题）", "搜索视图", list, null, false, { isSearch: true });
  showView("list"); renderTree(); $("#content").scrollTop = 0;
}
function hasAnyFilter(){
  return searchFilter.sources.length || searchFilter.module || searchFilter.chapter ||
         searchFilter.states.length || searchFilter.levels.length ||
         searchFilter.types.length || searchFilter.tags.length;
}
function runSearch(kw){
  const lower = (kw || "").toLowerCase();
  const isPaperView = (store.settings.viewMode === "set" || store.settings.viewMode === "topic");
  
  return QS_ALL.filter(q => {
    // 套卷/考点视图下，强制过滤掉没有套卷的题
    if (isPaperView && !q.paper) return false;

    // 👇 修复1：来源模糊匹配（例如选了“真题”，能匹配到“真题·2001年”）
    if(searchFilter.sources.length){
      const matchSource = searchFilter.sources.some(s => {
        return q.source === s || (q.source && q.source.includes(s));
      });
      if(!matchSource) return false;
    }

    if(searchFilter.module && q.module !== searchFilter.module) return false;
    if(searchFilter.chapter && q.chapter !== searchFilter.chapter) return false;
    if(searchFilter.states.length){
      const st = stateOf(q.id) || "_none";
      if(!searchFilter.states.includes(st)) return false;
    }
    if(searchFilter.levels.length && !searchFilter.levels.includes(q.level)) return false;
    
    // 题型过滤（兼容套卷）
    if(searchFilter.types.length) {
      const type = q.type || (q.groups && q.groups[1]) || "";
      if(!searchFilter.types.includes(type)) return false;
    }
    
    if(searchFilter.tags.length){
      const tags = getTags(q.id);
      if(!searchFilter.tags.some(t => tags.includes(t))) return false;
    }
    
    if(lower){
      const tags = getTags(q.id).join(" ").toLowerCase();
      const note = getNote(q.id).toLowerCase();
      const ans = String(q.answer || "").toLowerCase();
      
      // 👇 修复2：将题目的来源（q.source）也加入全文搜索范围
      const hay = (
        q.content + " " + 
        (q.options ? q.options.join(" ") : "") + " " + 
        q.chapter + " " + 
        q.module + " " + 
        (q.paper || "") + " " + 
        (q.source || "") + " " + 
        (q.level || "") + " " + 
        (q.type || "") + " " + 
        tags + " " + 
        note + " " + 
        ans
      ).toLowerCase();
      
      if(!hay.includes(lower)) return false;
    }
    return true;
  });
}

const pSel = { chapterTags: new Set(), modules: [], states: [], levels: [], types: [], chapters: [] };

function resetPSel(){
  pSel.chapterTags = new Set();
  pSel.modules.length = 0; pSel.states.length = 0; pSel.levels.length = 0; pSel.types.length = 0; pSel.chapters.length = 0;
}
function toggleIn(a, v){ const i = a.indexOf(v); if(i >= 0) a.splice(i, 1); else a.push(v); }
function pMatch(q){
  if(pSel.chapterTags.size){
    const custom = getTags(q.id);
    const hit = Array.from(pSel.chapterTags).some(key => {
      const sep = key.indexOf("||");
      return q.chapter === key.slice(0, sep) && custom.includes(key.slice(sep + 2));
    });
    if(!hit) return false;
  }
  if(pSel.modules.length && !pSel.modules.includes(q.module)) return false;
  if(pSel.states.length){
    const st = stateOf(q.id) || "_none";
    if(!pSel.states.includes(st)) return false;
  }
  if(pSel.levels.length && !pSel.levels.includes(q.level)) return false;
  if(pSel.types.length && !pSel.types.includes(q.type)) return false;
  if(pSel.chapters.length && !pSel.chapters.includes(q.chapter)) return false;
  return true;
}
function pMatchedList(){ return QS.filter(pMatch); }

/* ===== 练习会话 ===== */
let session = null;
function startSession(ids, opts){
  if(!ids || !ids.length){ toast("没有可练习的题目"); return; }
  session = { ids: ids.slice(), idx: 0, marks: {}, source: (opts && opts.source) || "练习", finished: false };
  saveSession(); showView("session"); renderSession();
  $("#content").scrollTop = 0;
}
function startRandomSession(n, label){
  if(!QS.length){ toast("题库为空"); return; }
  const ids = shuffleArr(QS.map(q => q.id)).slice(0, Math.min(n, QS.length));
  startSession(ids, { source: label });
}
function saveSession(){
  store.session = session ? { ids: session.ids, idx: session.idx, marks: session.marks, source: session.source, finished: session.finished } : null;
  saveStore();
}
function markAndNext(mark){
  if(!session || session.finished) return;
  const qid = session.ids[session.idx];
  if(mark){ session.marks[qid] = mark; setState(qid, mark); }
  if(session.idx < session.ids.length - 1) session.idx++;
  else session.finished = true;
  saveSession(); renderSession();
}
function renderSession(){
  const wrap = $("#viewSession");
  if(!session){
    wrap.innerHTML = '<div class="empty"><div class="t">没有进行中的练习</div><div class="d">去"专题练习"页选择条件开始</div></div>';
    return;
  }
  if(session.finished){ renderSummary(wrap); return; }
  const q = QS.find(x => String(x.id) === String(session.ids[session.idx]));
  if(!q){ wrap.innerHTML = '<div class="empty"><div class="t">题目不存在</div></div>'; return; }
  const total = session.ids.length, cur = session.idx + 1;
  wrap.innerHTML = "";
  const head = document.createElement("div");
  head.className = "session-head";
  head.innerHTML = '<div class="meta"><div class="tt">' + esc(session.source) + '</div><div class="st">' + cur + ' / ' + total + '</div><div class="pbar"><div class="pf" style="width:' + Math.round(cur/total*100) + '%"></div></div></div><button class="btn sm" id="sQuit">退出</button>';
  wrap.appendChild(head);
  head.querySelector("#sQuit").addEventListener("click", () => { saveSession(); gotoList({ chapter: q.chapter }); });
  wrap.appendChild(buildQItem(q, null, { showSource: false }));

  const actions = document.createElement("div");

  STATE_ORDER.forEach(k => {
    const s = STATES[k];
    const b = document.createElement("button");
    b.type = "button"; b.className = "sa-btn " + k;
    b.textContent = s.label + "，下一题";
    b.addEventListener("click", () => markAndNext(k));
    actions.appendChild(b);
  });
  const sk = document.createElement("button");
  sk.type = "button"; sk.className = "sa-btn";
  sk.textContent = "跳过";
  sk.addEventListener("click", () => markAndNext(null));
  actions.appendChild(sk);
  wrap.appendChild(actions);
}
function renderSummary(wrap){
  const marks = session.marks;
  const f = Object.values(marks).filter(v => v === "f").length;
  const v = Object.values(marks).filter(v => v === "v").length;
  const u = Object.values(marks).filter(v => v === "u").length;
  const total = session.ids.length;
  const skip = total - f - v - u;
  wrap.innerHTML = "";
  const card = document.createElement("div");
  card.className = "panel summary-card";
  card.innerHTML =
    '<div class="done-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>' +
    '<h2>本组练习完成</h2>' +
    '<div class="summary-stats">' +
      '<div class="sstat f"><div class="v">' + f + '</div><div class="k">熟悉</div></div>' +
      '<div class="sstat v"><div class="v">' + v + '</div><div class="k">模糊</div></div>' +
      '<div class="sstat u"><div class="v">' + u + '</div><div class="k">陌生</div></div>' +
      '<div class="sstat n"><div class="v">' + skip + '</div><div class="k">跳过</div></div>' +
    '</div>' +
    '<div class="summary-actions">' +
      '<button type="button" class="btn" id="sumRetry">重练模糊/陌生</button>' +
      '<button type="button" class="btn primary" id="sumDone">完成</button>' +
    '</div>';
  wrap.appendChild(card);
  card.querySelector("#sumRetry").addEventListener("click", () => {
    const ids = session.ids.filter(id => session.marks[id] === "v" || session.marks[id] === "u");
    if(!ids.length){ toast("本组没有需要巩固的题"); return; }
    session = null; saveSession();
    startSession(ids, { source: "重练模糊/陌生" });
  });
  card.querySelector("#sumDone").addEventListener("click", () => {
    session = null; saveSession();
    renderDashboard(); showView("dashboard"); renderTree();
  });
}

/* ===== 导入 / 导出 / 同步 ===== */
function buildProgressCsv(){
  const STATE_LABEL = { f: "熟悉", v: "模糊", u: "陌生" };
  const rows = [["题号ID", "来源", "模块", "章节", "题型", "进度", "标签", "笔记"]];
  for(const q of QS_ALL){
    /* 进度列 = 完整历史（中文，分号分隔）：熟悉;模糊;熟悉 */
    const records = recordsOf(q.id);
    const historyStr = records.map(r => STATE_LABEL[r] || "").filter(Boolean).join(";");
    const typeLabel = q.topic || (q.groups && q.groups[0]) || q.type || "";
    rows.push([
      String(q.id),
      q.source || "",
      q.module,
      q.chapter,
      typeLabel,
      historyStr,
      getTags(q.id).join(";"),
      getNote(q.id)
    ]);
  }
  return rows.map(r => r.map(cell => {
    const s = String(cell == null ? "" : cell);
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\r\n");
}
let syncHandle = null;
const syncSupported = !!(window.showOpenFilePicker && window.showSaveFilePicker);
function idbOpen(){ return new Promise((res, rej) => {
  try{
    const req = indexedDB.open("math880-sync", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("fh");
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }catch(e){ rej(e); }
}); }
async function loadSyncHandle(){
  try{
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction("fh", "readonly");
      const rq = tx.objectStore("fh").get("file");
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  }catch(e){ return null; }
}
async function persistSyncHandle(h){
  try{
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction("fh", "readwrite");
      tx.objectStore("fh").put(h, "file");
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }catch(e){}
}
async function clearSyncHandle(){
  try{
    const db = await idbOpen();
    return new Promise((res, rej) => {
      const tx = db.transaction("fh", "readwrite");
      tx.objectStore("fh").delete("file");
      tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
    });
  }catch(e){}
}
function updateSyncUI(){
  const d = $("#syncDesc");
  if(!d) return;
  if(syncHandle) d.textContent = "已绑定：" + (syncHandle.name || "progress.csv");
  else d.textContent = "未绑定 progress.csv";
  const btn = $("#reloadCsvBtn");
  if(btn){
    if(syncHandle) btn.classList.remove("attn");
    else btn.classList.add("attn");
  }
}
async function writeSyncFile(){
  if(!syncHandle || !syncSupported) return;
  const isEmpty = Object.keys(store.progress).length === 0
               && Object.keys(store.tags).length === 0
               && Object.keys(store.notes).length === 0;
  if(isEmpty){
    console.warn("[880] 本地数据为空，跳过写 CSV（保护原文件）");
    return;
  }
  try{
    let perm = await syncHandle.queryPermission({ mode: "readwrite" });
    if(perm !== "granted"){
      perm = await syncHandle.requestPermission({ mode: "readwrite" });
      if(perm !== "granted"){
        toast("未授权写入 progress.csv，请重新绑定");
        return;    // ← 不清除 handle，下次还能重试
      }
    }
    const w = await syncHandle.createWritable();
    await w.write("\ufeff" + buildProgressCsv());
    await w.close();
  }catch(e){
    console.error("[sync] 写入失败:", e);
    // 只在"文件被删/移动"时才清 handle
    if(e.name === "NotFoundError"){
      toast("progress.csv 找不到了，请重新绑定");
      syncHandle = null;
      await clearSyncHandle();
      updateSyncUI();
    } else {
      toast("自动同步失败：" + (e.message || e.name));
    }
  }
}
let syncTimer = null;
let syncTimer = null;
function autoSync(){
  // 如果有 GitHub 配置，自动把进度传到云端
  if(githubConfig && githubConfig.progressPath){
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      // 构建进度 CSV
      const STATE_LABEL = { f: "熟悉", v: "模糊", u: "陌生" };
      const rows = [["题号ID", "来源", "模块", "章节", "题型", "进度", "标签", "笔记"]];
      for(const q of QS_ALL){
        const records = recordsOf(q.id);
        const historyStr = records.map(r => STATE_LABEL[r] || "").filter(Boolean).join(";");
        const typeLabel = (q.topic || q.type || "").trim();
        rows.push([String(q.id), q.source || "", q.module, q.chapter, typeLabel, historyStr, getTags(q.id).join(";"), getNote(q.id)]);
      }
      const csvStr = rows.map(r => r.map(cell => {
        const s = String(cell == null ? "" : cell);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(",")).join("\r\n");

      await writeToGithub("\ufeff" + csvStr, true);
      console.log("进度已同步至云端");
    }, 1500); // 防抖 1.5 秒，防止连续点击导致频繁请求
    return;
  }

  // 原有的本地同步逻辑
  if(!syncHandle || !syncSupported) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(writeSyncFile, 500);
}
async function loadFromBoundCsv(opts){
  const silent = opts && opts.silent;
  if(!syncSupported){ if(!silent) toast("浏览器不支持自动读文件，请用「导入」手动选 CSV"); return false; }
  if(!syncHandle){ if(!silent) toast("尚未绑定 progress.csv，请先在设置里绑定"); return false; }
  try{
    let perm = await syncHandle.queryPermission({ mode: "readwrite" });
    if(perm !== "granted"){
      perm = await syncHandle.requestPermission({ mode: "readwrite" });
      if(perm !== "granted"){ if(!silent) toast("未授权读写该文件"); return false; }
    }
    const file = await syncHandle.getFile();
    importProgressFile(file);
    return true;
  }catch(e){
    if(!silent) toast("读取失败：" + (e.message || ""));
    return false;
  }
}

function parseCsv(text){
  const rows = []; let row = [], cell = "", inQ = false;
  const s = text.replace(/^\ufeff/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
  for(let i = 0; i < s.length; i++){
    const c = s[i];
    if(inQ){
      if(c === '"'){ if(s[i+1] === '"'){ cell += '"'; i++; } else inQ = false; }
      else cell += c;
    } else if(c === '"') inQ = true;
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if(cell !== "" || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}
function parseProgressCsvText(text) {
  if(!text) return;
  const rows = parseCsv(text);
  if(!rows || !rows.length) return;
  const hdr = rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, ""));
  const find = (zh, en) => { const i = hdr.indexOf(zh); return i >= 0 ? i : hdr.indexOf(en); };
  const ci = { id: find("题号id","id"), st: find("进度","状态"), tags: find("标签","tags"), notes: find("笔记","notes") };
  if(ci.id < 0) return;

  for(let i = 1; i < rows.length; i++){
    const r = rows[i];
    const qid = String(r[ci.id] || "").trim();
    if(!qid) continue;
    
    if(ci.st >= 0){
      const raw = String(r[ci.st] || "").trim();
      if(raw){
        const parts = raw.split(/[;；、|]+/).map(x => x.trim()).filter(Boolean);
        const arr = [];
        for(const p of parts){
          if(p === "熟悉" || p === "已掌握" || p === "f" || p === "m") arr.push("f");
          else if(p === "模糊" || p === "待复习" || p === "v" || p === "r") arr.push("v");
          else if(p === "陌生" || p === "u") arr.push("u");
        }
        if(arr.length) store.progress[qid] = arr.slice(-REC_MAX);
      }
    }
    if(ci.tags >= 0){
      const arr = [];
      String(r[ci.tags] || "").split(/[;；、|]+/).forEach(t => { t = t.trim(); if(t && !arr.includes(t)) arr.push(t); });
      if(arr.length) store.tags[qid] = arr;
    }
    if(ci.notes >= 0){
      const n = String(r[ci.notes] || "").trim();
      if(n) store.notes[qid] = { text: n, updatedAt: Date.now() };
    }
  }
  saveStore();
}  
function importProgressFile(file){
  const reader = new FileReader();
  reader.onload = () => {
    let merged = 0;
    const text = reader.result;
    if(file.name.toLowerCase().endsWith(".csv")){
      const rows = parseCsv(text);
      if(!rows.length){ toast("文件为空"); return; }
      const hdr = rows[0].map(h => String(h).trim().toLowerCase().replace(/\s+/g, ""));
      const find = (zh, en) => { const i = hdr.indexOf(zh); return i >= 0 ? i : hdr.indexOf(en); };
      const ci = { id: find("题号id","id"), st: find("进度","状态"), tags: find("标签","tags"), notes: find("笔记","notes") };
      if(ci.id < 0){ toast("CSV 缺少「题号ID」列"); return; }

      for(let i = 1; i < rows.length; i++){
        const r = rows[i];
        const qid = String(r[ci.id] || "").trim();
        if(!qid) continue;

        if(ci.st >= 0){
          const raw = String(r[ci.st] || "").trim();
          if(raw){
            const parts = raw.split(/[;；、|]+/).map(x => x.trim()).filter(Boolean);
            const arr = [];
            for(const p of parts){
              if(p === "熟悉" || p === "已掌握") arr.push("f");
              else if(p === "模糊" || p === "待复习") arr.push("v");
              else if(p === "陌生") arr.push("u");
              else if(p === "f" || p === "m") arr.push("f");
              else if(p === "v" || p === "r") arr.push("v");
              else if(p === "u") arr.push("u");
            }
            if(arr.length){
              store.progress[qid] = arr.slice(-REC_MAX);
              merged++;
            }
          }
        }

        if(ci.tags >= 0){
          const arr = [];
          String(r[ci.tags] || "").split(/[;；、|]+/).forEach(t => { t = t.trim(); if(t && !arr.includes(t)) arr.push(t); });
          if(arr.length) store.tags[qid] = arr;
        }

        if(ci.notes >= 0){
          const n = String(r[ci.notes] || "").trim();
          if(n) store.notes[qid] = { text: n, updatedAt: Date.now() };
        }
      }

      touchStore(); saveStore();
      toast("已导入 " + merged + " 题进度");

    } else {
      let data = null;
      try { data = JSON.parse(text); } catch(e){ toast("无法解析"); return; }
      if(!data || data.app !== "math880"){ toast("不是有效备份"); return; }

      for(const qid in data.tags || {}){
        const key = String(qid);
        if(!store.tags[key]) store.tags[key] = [];
        (Array.isArray(data.tags[qid]) ? data.tags[qid] : []).forEach(t => {
          if(typeof t === "string" && t.trim() && !store.tags[key].includes(t)) store.tags[key].push(t);
        });
      }

      for(const qid in data.progress || {}){
        const v = data.progress[qid];
        const key = String(qid);
        if(Array.isArray(v)){
          const arr = v.filter(x => x === "f" || x === "v" || x === "u").slice(-REC_MAX);
          if(arr.length) store.progress[key] = arr;
        } else if(typeof v === "string"){
          if(v === "f" || v === "m") store.progress[key] = ["f"];
          else if(v === "v" || v === "r") store.progress[key] = ["v"];
          else if(v === "u") store.progress[key] = ["u"];
        }
      }

      for(const qid in data.notes || {}){
        const n = data.notes[qid];
        if(n && typeof n === "object" && typeof n.text === "string"){
          store.notes[String(qid)] = { text: n.text, updatedAt: n.updatedAt || Date.now() };
        }
      }

      touchStore(); saveStore();
      toast("备份已导入");
    }
    refreshCurrentView();
  };
  reader.onerror = () => toast("读取文件失败");
  reader.readAsText(file);
}

/* 从搜索结果 / 套卷视图 跳回"按难度"的章节上下文 */
function jumpToContext(q){
  if(!q){ toast("找不到题目"); return; }

  /* 章节为空 → 只能在套卷视图里看 */
  if(!q.chapter){
    if(q.paper){
      gotoList({ paper: q.paper, sourceKey: q.source });
      setTimeout(() => scrollToQid(q.id), 120);
    } else {
      toast("该题无章节，无法定位");
    }
    return;
  }

  /* 切到"按难度"视图 */
  if(store.settings.viewMode !== "level"){
    store.settings.viewMode = "level";
    touchStore(); saveStore();
    const tg = $("#viewToggle");
    if(tg){
      tg.querySelectorAll("button").forEach(b => {
        b.classList.toggle("on", b.dataset.mode === "level");
      });
    }
    renderTree();
  }

  /* 跳转到该题的章节 */
  gotoList({ chapter: q.chapter });
  setTimeout(() => scrollToQid(q.id), 120);
}

function scrollToQid(qid){
  let tries = 0;
  const find = () => {
    const el = document.querySelector('.qitem[data-qid="' + qid + '"]');
    if(el){
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      const oldBg = el.style.background;
      el.style.transition = "background .3s";
      el.style.background = "#FFF3C4";
      setTimeout(() => { el.style.background = oldBg; }, 1800);
      toast("已定位");
      return;
    }
    const btn = document.querySelector(".loadmore-btn");
    if(btn && tries < 100){
      tries++;
      btn.click();
      setTimeout(find, 40);
    } else {
      toast("未在当前列表中找到");
    }
  };
  find();
}

/* 跳转到指定题目：切来源、切章节、滚动、高亮 */
function jumpToQuestion(qid){
  const q = QS_ALL.find(x => x.id === qid);
  if(!q){ toast("找不到新题"); return; }

  /* 1. 来源不一致 → 先切来源 */
  const curSrc = store.settings.activeSource || "";
  if(curSrc && curSrc !== q.source){
    store.settings.activeSource = q.source;
    touchStore(); saveStore();
    const sel = $("#sourceFilter");
    if(sel) sel.value = q.source;
    rebuildIndex();

  }

  gotoList({ chapter: q.chapter });

  let tries = 0;

      btn.click();

let editingQid = null;

function _getSourcePrefix(source){
  const map = { "880":"880", "XDF":"xdf", "严选": "yx", "严选题":"yx",
                "辅导讲义":"jc", "概率论辅导讲义":"jc" };
  if(map[source]) return map[source];
  return source.replace(/[^\x00-\x7F]/g, "").slice(0, 3).toLowerCase() || "q";
}

function refreshEditSourceDatalist(currentValue){
  const sel = $("#editSourceKey");
  if(!sel || sel.tagName !== "SELECT") return;

  const set = new Set();
  QS_ALL.forEach(q => { if(q.source) set.add(q.source); });
  ["880","XDF","辅导讲义","严选题"].forEach(s => set.add(s));

  const order = ["880","严选题","辅导讲义","XDF"];
  const list = Array.from(set).sort((a, b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    if(ia >= 0 && ib >= 0) return ia - ib;
    if(ia >= 0) return -1;
    if(ib >= 0) return 1;
    return a.localeCompare(b, "zh");
  });

  let html = '<option value="">（请选择）</option>';
  list.forEach(s => {
    html += '<option value="' + esc(s) + '">' + esc(s) + '</option>';
  });
  html += '<option value="__custom__">✏️ 手动输入…</option>';
  sel.innerHTML = html;

  const cur = String(currentValue || "").trim();
  if(cur && !list.includes(cur)){
    const opt = document.createElement("option");
    opt.value = cur;
    opt.textContent = cur + "（自定义）";
    const customOpt = sel.querySelector('option[value="__custom__"]');
    sel.insertBefore(opt, customOpt);
  }
  sel.value = cur;
  sel.dataset.prev = cur;

  if(!sel._bound){
    sel._bound = true;
    sel.addEventListener("change", () => {
      if(sel.value === "__custom__"){
        const v = prompt("请输入来源：", sel.dataset.prev || "");
        if(v !== null && v.trim()){
          const val = v.trim();
          if(!Array.from(sel.options).some(o => o.value === val)){
            const opt = document.createElement("option");
            opt.value = val;
            opt.textContent = val + "（自定义）";
            const customOpt = sel.querySelector('option[value="__custom__"]');
            sel.insertBefore(opt, customOpt);
          }
          sel.value = val;
          sel.dataset.prev = val;
        } else {
          sel.value = sel.dataset.prev || "";
        }
      } else {
        sel.dataset.prev = sel.value;
      }
    });
  }
}

async function saveEdit(){
  const id = ($("#editIdInput").value || "").trim();
  if(!id){ toast("题号 ID 不能为空"); return; }

  const source = ($("#editSourceKey").value || "").trim();
  if(!source){ toast("来源不能为空"); return; }

  const module = $("#editModule").value;
  const chapter = ($("#editChapter").value || "").trim();

  const g1 = ($("#editG1").value || "").trim();
  const g2 = ($("#editG2").value || "").trim();
  const topic = ($("#editTopicText").value || "").trim();
  const content = ($("#editContent").value || "").trim();
  if(!content){ toast("题目内容不能为空"); return; }

  const opts = ["A","B","C","D"].map(L => ($("#edit" + L).value || "").trim());
  const answer = ($("#editAnswer").value || "").trim();
  const filled = opts.filter(Boolean).length;
  const isChoice = g2 === "选择题" || filled >= 2;
  if(isChoice && filled < 2){
    toast("选择题至少要有选项内容");
    return;
  }
  const finalOpts = isChoice ? opts.filter(Boolean) : [];

  if(editingQid){
    /* ---------- 编辑 ---------- */
    if(id !== editingQid && QS_ALL.find(x => x.id === id)){
      toast("题号 ID「" + id + "」已被占用");
      return;
    }
    const q = QS_ALL.find(x => x.id === editingQid);
    if(!q){ toast("题目已不存在"); return; }

    /* ID 变更 → 迁移进度 / 标签 / 笔记 */
    if(id !== editingQid){
      if(store.progress[editingQid] !== undefined){
        store.progress[id] = store.progress[editingQid];
        delete store.progress[editingQid];
      }
      if(store.tags[editingQid]){
        store.tags[id] = store.tags[editingQid];
        delete store.tags[editingQid];
      }
      if(store.notes[editingQid]){
        store.notes[id] = store.notes[editingQid];
        delete store.notes[editingQid];
      }
      touchStore(); saveStore();
    }

    q.id = id;
    q.source = source;
    q.sourceKey = source;
    q.module = module;
    q.chapter = chapter;
    q.groups = [g1, g2].filter(Boolean);
    q.level = q.groups[0] || "";
    q.type = q.groups[1] || "";
    q.topic = topic;
    q.paper = ($("#editPaper").value || "").trim();
    q.seq = ($("#editSeq").value || "").trim();    
    q.content = content;
    q.options = finalOpts;
    q.answer = answer;
    /* --- 位置调整 --- */
    const anchor = ($("#editInsertBefore").value || "").trim();
    if(anchor && anchor !== q.id){
      const curIdx = QS_ALL.findIndex(x => x.id === q.id);
      if(curIdx >= 0){
        // 先拿出这道题
        const [moved] = QS_ALL.splice(curIdx, 1);
        // 找锚点（注意 splice 后锚点索引可能变了，重新找）
        const anchorIdx = QS_ALL.findIndex(x => x.id === anchor);
        if(anchorIdx < 0){
          // 锚点找不到，放回原位
          QS_ALL.splice(curIdx, 0, moved);
          toast("找不到锚点题号 " + anchor + "，位置未变");
        } else {
          // 插到锚点之后
          QS_ALL.splice(anchorIdx + 1, 0, moved);
        }
      }
    }
    store.settings.lastEditSource = source;
    touchStore(); saveStore();

    const ok = await writeQuestionsToBoundCsv();
    if(!ok) return;

    closeEditModal();
    rebuildIndex();
    renderTree();
    if(typeof refreshSourceDropdown === "function") refreshSourceDropdown();

    if(currentView === "list"){
      if(listState.sel){
        const { list, title } = buildListFromSel(listState.sel);
        renderListView(title, listState.subtitle, list, listState.sel, true);
      } else {
        renderListView(listState.title, listState.subtitle, listState.list, null, true);
      }
    } else {
      refreshCurrentView();
    }
    toast("已保存");

  } else {
    /* ---------- 新增 ---------- */
    if(QS_ALL.find(x => x.id === id)){
      toast("题号 ID「" + id + "」已存在");
      return;
    }

    const sameChapter = QS_ALL.filter(x => x.source === source && x.chapter === chapter);
    const no = sameChapter.length + 1;

    const newQ = {
      id, source, sourceKey: source,
      module, moduleKey: "",
      chapter, chapterKey: "",
      paper: ($("#editPaper").value || "").trim(),
      seq: ($("#editSeq").value || "").trim(),
      groups: [g1, g2].filter(Boolean),
      level: g1, type: g2,
      topic,
      no,
      content,
      options: finalOpts,
      answer
    };

    const anchor = ($("#editInsertBefore").value || "").trim();
    if(anchor){
      const idx = QS_ALL.findIndex(x => x.id === anchor);
      if(idx < 0){
        toast("找不到锚点题号 " + anchor + "，已放末尾");
        QS_ALL.push(newQ);
      } else {
        QS_ALL.splice(idx + 1, 0, newQ);   // ← 插到锚点之后
      }
    } else {
      QS_ALL.push(newQ);
    }

    store.settings.lastEditSource = source;
    touchStore(); saveStore();

    const ok = await writeQuestionsToBoundCsv();
    if(!ok) return;

    closeEditModal();
    rebuildIndex();
    renderTree();
    if(typeof refreshSourceDropdown === "function") refreshSourceDropdown();

    if(typeof jumpToQuestion === "function"){
      jumpToQuestion(id);
    } else {
      refreshCurrentView();
      toast("已新增");
    }
  }
}

async function deleteEdit(){
  if(!editingQid){ toast("没有可删除的题目"); return; }
  if(!confirm("确定删除这道题吗？此操作不可恢复。")) return;
  if(!questionsHandle){ toast("请先绑定题库 CSV"); return; }

  const idx = QS_ALL.findIndex(q => q.id === editingQid);
  if(idx === -1){ toast("题目不存在"); return; }

  const backupQ = QS_ALL[idx];
  const backupProgress = store.progress[editingQid];
  const backupTags = store.tags[editingQid];
  const backupNotes = store.notes[editingQid];

  QS_ALL.splice(idx, 1);
  delete store.progress[editingQid];
  delete store.tags[editingQid];
  delete store.notes[editingQid];
  touchStore(); saveStore();

  const ok = await writeQuestionsToBoundCsv();
  if(!ok){
    QS_ALL.splice(idx, 0, backupQ);
    if(backupProgress !== undefined) store.progress[editingQid] = backupProgress;
    if(backupTags !== undefined) store.tags[editingQid] = backupTags;
    if(backupNotes !== undefined) store.notes[editingQid] = backupNotes;
    touchStore(); saveStore();
    toast("删除失败，已恢复");
    return;
  }

  closeEditModal();
  rebuildIndex();
  renderTree();
  if(currentView === "list"){
    if(listState.sel){
      const { list, title } = buildListFromSel(listState.sel);
      renderListView(title, listState.subtitle, list, listState.sel, true);
    } else {
      renderListView(listState.title, listState.subtitle, listState.list, null, true);
    }
  } else {
    refreshCurrentView();
  }
  toast("已删除");
}

/* ===== 侧栏头部：来源 + 视图 ===== */
function refreshSourceDropdown(){
  const sel = $("#sourceFilter");
  if(!sel) return;
  const srcs = new Set();
  QS_ALL.forEach(q => { if(q.source) srcs.add(q.source); });
  const order = ["880","严选题","辅导讲义","XDF","真题","模拟卷"];
  const list = order.filter(s => srcs.has(s))
    .concat(Array.from(srcs).filter(s => !order.includes(s)));
  sel.innerHTML = '<option value="">全部来源</option>' +
    list.map(s => '<option value="' + esc(s) + '">' + esc(s) + '</option>').join("");
  sel.value = store.settings.activeSource || "";
}

let _sidebarHeadInitialized = false;
function initSidebarHead(){
  refreshSourceDropdown();

  if(_sidebarHeadInitialized) return;
  _sidebarHeadInitialized = true;

  const sel = $("#sourceFilter");
  sel.addEventListener("change", () => {
    const src = sel.value;
    store.settings.activeSource = src;

    /* 真题 / 模拟卷 → 自动切到"套卷"视图 */
    const setSources = ["真题", "模拟卷"];
    if(setSources.includes(src)){
      store.settings.viewMode = "set";
    } else if(store.settings.viewMode === "set" || store.settings.viewMode === "topic"){
      /* 从套卷来源切走，或者正在考点视图 → 只要不是真题/模拟卷，统统回到"按难度" */
      store.settings.viewMode = "level";
    }

    /* 同步视图按钮高亮 */
    const tg = $("#viewToggle");
    if(tg){
      tg.querySelectorAll("button").forEach(b => {
        b.classList.toggle("on", b.dataset.mode === store.settings.viewMode);
      });
    }

    touchStore(); saveStore();
    rebuildIndex();
    renderTree();
    renderDashboard();
    showView("dashboard");
  });

  const tg = $("#viewToggle");
  const btns = tg.querySelectorAll("button");
  function syncToggle(){
    btns.forEach(b => {
      b.classList.toggle("on", b.dataset.mode === (store.settings.viewMode || "level"));
    });
  }
  btns.forEach(b => {
    b.addEventListener("click", () => {
      store.settings.viewMode = b.dataset.mode;
      touchStore(); saveStore();
      syncToggle();
      renderTree();
    });
  });
  syncToggle();
}

document.addEventListener("keydown", e => {
  if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
  if(e.key === "Escape"){
    if($("#settingsOverlay").classList.contains("open")){ $("#settingsOverlay").classList.remove("open"); return; }
    if($("#searchPanel").classList.contains("open")){ $("#searchPanel").classList.remove("open"); $("#searchFilterBtn").classList.remove("on"); return; }
    closeSidebar();
  }
  if(currentView === "session" && session && !session.finished){
    if(e.key === "1"){ e.preventDefault(); markAndNext("f"); }
    else if(e.key === "2"){ e.preventDefault(); markAndNext("v"); }
    else if(e.key === "3"){ e.preventDefault(); markAndNext("u"); }
    else if(e.key === " "){ e.preventDefault(); markAndNext(null); }
  }
});

(async () => {
  /* 1. 尝试加载绑定的题库 CSV */
    // 先尝试加载 GitHub 云端题库
  loadGithubConfig();
  if(githubConfig) {
    await fetchFromGithub();
  }
  const h = await loadQuestionsHandle();
  if(h){
    questionsHandle = h;
    updateQuestionsUI();
    try{
      let perm = await h.queryPermission({ mode: "read" });
      if(perm !== "granted"){
        perm = await h.requestPermission({ mode: "read" });
      }
      if(perm === "granted"){
        const file = await h.getFile();
        const text = await file.text();
        const parsed = parseQuestionsCsv(text);
        if(parsed.length) QS_ALL = parsed;
      }
    }catch(e){}
  }

  /* 2. 尝试加载绑定的进度 CSV */
  const hp = await loadSyncHandle();
  if(hp){
    syncHandle = hp;
    updateSyncUI();
    try{
      const perm = await hp.queryPermission({ mode: "read" });
      if(perm === "granted"){
        const file = await hp.getFile();
        if(file) importProgressFile(file);
      } else {
        setTimeout(() => toast("点一下顶栏的 ⟳ 可从 progress.csv 读取进度"), 600);
      }
    }catch(e){}
  }

  /* 3. 初始化 UI */
  store.settings.treeState = {};
  rebuildIndex();
  initSidebarHead();
  setupEditFormListeners();
  renderTree();
  renderPractice();
  updateTopNewBtn();
  
  if(!QS_ALL.length){
    toast("请先绑定 questions.csv");
  }

  /* 4. 首页 */
  const openWith = store.settings.openWith || "dashboard";
  if(openWith === "last" && store.settings.lastChapter && QUESTIONS_BY_CHAPTER[store.settings.lastChapter]){
    renderDashboard();
    gotoList({ chapter: store.settings.lastChapter });
  } else {
    renderDashboard();
    showView("dashboard");
  }
})();

});
